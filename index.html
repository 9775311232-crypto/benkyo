{t:'細胞と生物の分類',html:`
<h2>生命を分子のレベルで理解する</h2>
<p class="lead">この授業の目的は、生命を<b>化学の視点で分子レベル</b>で理解すること。細胞、核酸、タンパク質、脂質、糖を扱う。教科書は『Essential細胞生物学』（原書第5版）。</p>
<h3>細胞の4つの基本</h3>
<ul>
<li>すべての生物は<b>細胞</b>からできている（細胞は生命の基本単位）</li>
<li>大きさは、原核生物が<b>数 µm</b>、真核生物が<b>数十 µm</b> 程度</li>
<li>細胞は、自分を外界から分ける<b>細胞膜</b>に包まれている</li>
<li>どの細胞も共通の<b>セントラルドグマ</b>をもち、遺伝情報の<b>複製・転写・翻訳</b>を行う</li>
</ul>
<div class="flow">
<div><b>DNA</b>　複製（DNA 合成）で増える</div>
<div><b>RNA</b>　DNA から転写（RNA 合成）</div>
<div><b>タンパク質</b>　RNA から翻訳（タンパク質合成）</div>
</div>
<h3>生物の分類</h3>
<div class="duo">
<div><strong>原核生物</strong><span>核を<b>もたない</b></span><span>細菌と古細菌（アーキア）の2つのドメイン</span></div>
<div><strong>真核生物</strong><span>核を<b>もつ</b></span><span>動物・植物・真菌など</span></div>
</div>
<p>すべての細胞は<b>共通の祖先</b>に由来し、進化で多様化したと考えられている。真核生物はミトコンドリアを獲得し（約15億年前）、その後、一部が葉緑体を獲得して植物になった。</p>
<p class="slide">対応スライド：第1回 p.2〜8</p>`},

{t:'細胞小器官',html:`
<h2>真核細胞の中のしくみ</h2>
<p class="lead">真核細胞の中には、膜で囲まれた<b>細胞小器官</b>がある。細胞は様々な分子（DNA・タンパク質・糖・脂質）が集まってできた<b>分子の集合体</b>で、中では小器官や分子が絶えず動いている。</p>
<div class="defs">
<div><span class="k">核</span><span><b>核膜</b>（2枚の膜）に包まれ、遺伝情報の <b>DNA</b> を入れている</span></div>
<div><span class="k">ミトコンドリア</span><span><b>外膜と内膜</b>に囲まれる。糖などの食物分子を<b>酸化</b>して<b>化学エネルギー</b>をつくる。<b>独自の DNA</b> をもつ</span></div>
<div><span class="k">葉緑体</span><span>植物と藻類だけ。<b>光合成</b>で糖などの有機分子と酸素をつくる</span></div>
<div><span class="k">小胞体など</span><span>小胞体・ゴルジ体・リソソームを通して、細胞の内外で物質をやりとりする</span></div>
<div><span class="k">細胞質ゾル</span><span>小器官以外のすき間。有機分子の代謝やタンパク質の合成が起こる</span></div>
<div><span class="k">細胞骨格</span><span>細胞内に張りめぐらされたタンパク質の繊維。細胞の形・動き・物質の輸送を担う</span></div>
</div>
<h3>話題になった研究（閑話休題）</h3>
<ul>
<li>遺伝子編集 CRISPR/Cas9：細菌の免疫のしくみから生まれた（2020年ノーベル化学賞、シャルパンティエ・ダウドナ）</li>
<li>mRNA ワクチン：塩基を修飾（ウリジン → シュードウリジン）した mRNA で炎症を抑え、タンパク質の生産を増やした（2023年ノーベル生理学・医学賞、カリコほか）</li>
<li>制御性T細胞：免疫が自分を攻撃しないようにする（2025年ノーベル生理学・医学賞、坂口志文）</li>
</ul>
<p class="slide">対応スライド：第1回 p.9〜14</p>`},

</div>
<p class="slide">対応スライド：第1回 p.15〜20</p>`}

L({subj:'seimei',id:'s1008',date:'10/8',title:'第2回 生命の化学（生体分子）',short:'2回 生体分子',
ch:[
{t:'元素と結合',html:`
<h2>細胞をつくる元素と結合</h2>
<p class="lead">細胞は <b>C・H・N・O</b> の4元素で重さの約96%（原子の数では99%）を占める。反応は<b>水溶液中</b>の狭い温度範囲で、いろいろな分子が混ざった<b>夾雑系</b>の中で起こる。</p>
<h3>共有結合</h3>
<p>となりあう原子が<b>電子を共有</b>してできる強い結合。熱運動では切れない。つくる結合の数は H 1本、O 2本、N 3本、C 4本。ちがう原子どうしでは電子がかたよって<b>極性</b>が生まれる。</p>
<h3>結合の強さの比較（表2-1）</h3>
<div class="tblwrap"><table class="tbl">
<tr><th>結合</th><th>長さ</th><th>真空中</th><th>水中</th></tr>
<tr><td>共有結合</td><td>0.10 nm</td><td>377</td><td>377</td></tr>
<tr><td>イオン結合</td><td>0.25 nm</td><td>335</td><td><b>12.6</b></td></tr>
<tr><td>水素結合</td><td>0.17 nm</td><td>16.7</td><td>4.2</td></tr>
<tr><td>ファンデルワールス</td><td>0.35 nm</td><td>0.4</td><td>0.4</td></tr>
</table></div>
<p>単位は kJ/mol。<b>イオン結合と水素結合は水中で大きく弱まる</b>。</p>
<h3>官能基</h3>
<div class="defs">
<div><span class="k">炭化水素</span><span>C と H だけ。<b>非極性</b>で水に溶けない</span></div>
<div><span class="k">−OH</span><span>ヒドロキシ基（アルコール）</span></div>
<div><span class="k">C=O</span><span>カルボニル基（アルデヒド・ケトン）</span></div>
<div><span class="k">−COOH</span><span>カルボキシ基（カルボン酸）</span></div>
<div><span class="k">−NH₂</span><span>アミノ基（アミン）</span></div>
</div>
<p>生体分子には<b>エステル・アミド・リン酸ジエステル</b>などの結合もある。</p>
<p class="slide">対応スライド：第2回 p.3〜5</p>`},

{t:'糖と脂質',html:`
<h2>4種類の有機小分子（分子量100〜1000）</h2>
<div class="tblwrap"><table class="tbl">
<tr><th>小分子</th><th>つながってできるもの</th></tr>
<tr><td>糖</td><td>多糖</td></tr>
<tr><td>脂肪酸</td><td>脂肪・膜脂質</td></tr>
<tr><td>アミノ酸</td><td>タンパク質</td></tr>
<tr><td>ヌクレオチド</td><td>核酸（DNA・RNA）</td></tr>
</table></div>
<h3>糖：エネルギー源の中心</h3>
<ul>
<li><b>(CH₂O)ₙ</b> で表され、carbohydrate（<b>炭水化物</b>）とも呼ばれる</li>
<li>単糖の<b>グルコース</b>の代謝でエネルギーをつくる</li>
<li>多糖として<b>グリコーゲン（動物）</b>や<b>デンプン（植物）</b>の形で貯める</li>
<li>細胞膜や細胞壁の表面の修飾にも使われる</li>
</ul>
<p>単糖は n = 3〜6（トリオース・ペントース・ヘキソース）。アルデヒド基をもつ<b>アルドース</b>とケトン基をもつ<b>ケトース</b>がある。水中では<b>環状</b>。グルコース・ガラクトース・マンノースはどれも C₆H₁₂O₆（異性体）。</p>
<div class="tblwrap"><table class="tbl">
<tr><th>二糖</th><th>つくり</th><th>結合</th></tr>
<tr><td>マルトース</td><td>グルコース＋グルコース</td><td>α</td></tr>
<tr><td>ラクトース</td><td>ガラクトース＋グルコース</td><td>β</td></tr>
<tr><td>スクロース</td><td>グルコース＋フルクトース</td><td></td></tr>
</table></div>
<p>単糖どうしは<b>グリコシド結合</b>でつながる。α と β で形がちがう。</p>
<h3>脂質：膜とエネルギーの貯蔵</h3>
<ul>
<li><b>脂肪酸</b>：長い炭化水素の尾＋カルボキシ基。二重結合が<b>ない</b>のが<b>飽和</b>（ステアリン酸 C18、パルミチン酸 C16）、<b>ある</b>のが<b>不飽和</b>（オレイン酸 C18、折れ曲がる）</li>
<li><b>トリアシルグリセロール</b>：グリセロールに脂肪酸3つがエステル結合。脂肪滴として貯め、エネルギー源になる</li>
<li><b>リン脂質</b>：グリセロールの −OH の2つに脂肪酸、1つにリン酸＋極性基（コリンならホスファチジルコリン）。<b>脂質二重層</b>をつくり、細胞膜の基礎になる</li>
<li><b>ステロイド</b>：コレステロール、テストステロンなど</li>
</ul>
<p class="slide">対応スライド：第2回 p.6〜11</p>`},

{t:'アミノ酸とヌクレオチド',html:`
<h2>アミノ酸とヌクレオチド</h2>
<h3>アミノ酸：タンパク質の部品</h3>
<ul>
<li><b>アミノ基</b>と<b>カルボキシ基</b>が同じ <b>α炭素</b>についていて、そこに<b>側鎖</b>（R）がつく</li>
<li>pH 7 付近では −NH₃⁺ と −COO⁻ に<b>荷電</b>している</li>
<li>タンパク質のアミノ酸は <b>L 体</b>（H を手前にして上から見ると CO → R → N が時計回り＝CORN）</li>
<li>アミノ酸どうしが<b>脱水縮合</b>して<b>ペプチド結合（アミド結合）</b>をつくる</li>
</ul>
<div class="defs">
<div><span class="k">非極性</span><span>Ala Val Leu Ile Pro Phe Met Trp Gly（講義の表では Cys もここ）</span></div>
<div><span class="k">極性</span><span>Asn Gln Ser Thr Tyr（電荷なし）</span></div>
<div><span class="k">酸性</span><span>Asp Glu（負に荷電）</span></div>
<div><span class="k">塩基性</span><span>Lys Arg His（正に荷電）</span></div>
</div>
<h3>ヌクレオチド：DNA・RNA の部品＋エネルギーの運び屋</h3>
<div class="flow">
<div><b>ヌクレオシド</b> = 塩基 ＋ 糖（N-グリコシド結合）</div>
<div><b>ヌクレオチド</b> = ヌクレオシドの糖にリン酸が1個以上</div>
</div>
<div class="duo">
<div><strong>RNA</strong><span>糖：<b>リボース</b></span><span>塩基：A・U・G・C</span></div>
<div><strong>DNA</strong><span>糖：<b>デオキシリボース</b>（2′ に OH がない）</span><span>塩基：A・T・G・C</span></div>
</div>
<p>プリン（二つの環）＝ <b>A・G</b>、ピリミジン（一つの環）＝ <b>C・T・U</b>。ATP はエネルギーを短期間たくわえる。</p>
<h3>生体高分子</h3>
<p>細菌細胞は水70%・化学物質30%（タンパク質15%、RNA 6%、DNA 1%、リン脂質2%、多糖2%）。単量体が<b>決まった配列</b>で重合する。200 アミノ酸なら 20²⁰⁰ ≈ 10²⁶⁰ 通り。つなぐときは脱水（縮合）、切るときは<b>加水分解</b>。</p>
<p class="slide">対応スライド：第2回 p.12〜18</p>`},

{t:'非共有結合',html:`
<h2>非共有結合：弱いけれど数で勝負</h2>
<p class="lead">1つ1つは共有結合の <b>1/20 以下</b>の強さ。でもたくさん集まることで、分子を<b>特定の3次元構造に折りたたみ</b>、ほかの分子と<b>特異的にくっつく</b>。</p>
<div class="defs">
<div><span class="k">vdW力</span><span><b>ファンデルワールス力</b>。どの原子間にも働く、ごく近距離の弱い引力。近づきすぎると反発。ファンデルワールス半径：H 0.12、C 0.2、N 0.15、O 0.14 nm</span></div>

<p class="slide">対応スライド：第2回 p.19〜24</p>`}

ch:[
{t:'酸化とエネルギー',html:`
<h2>細胞はどうやってエネルギーを得るのか</h2>
<p class="lead">細胞の中の反応は、ふつうなら高温でしか起こらないものばかり。<b>酵素</b>（タンパク質）が触媒になって、体温で進める。分子を壊してエネルギーを得る<b>異化</b>と、分子をつくる<b>同化</b>がある。</p>
<h3>秩序を保つしくみ</h3>
<p>熱力学第二法則では、ものごとは無秩序（エントロピー増大）に向かう。細胞は外からエネルギーを取り入れて<b>熱を外に捨てる</b>ことで、自分の中の秩序を保っている。</p>
<h3>酸化でエネルギーを取り出す</h3>
<p>糖などの有機分子の炭素と水素を酸素と結合させ（<b>酸化</b>）、CO₂ と H₂O にしてエネルギーを得る。これが<b>呼吸</b>。</p>
<div class="duo">
<div><strong>光合成</strong><span>CO₂ + H₂O → O₂ + 糖</span></div>
<div><strong>呼吸</strong><span>糖 + O₂ → H₂O + CO₂</span></div>
</div>
<p>酸化とは、<b>酸素原子が付く／電子が奪われる／水素原子が奪われる</b>こと。</p>
<ul>
<li>CH₃CHO → CH₃COOH（O が付く）</li>
<li>Na → Na⁺（電子が奪われる）</li>
<li>CH₃CH₃ → CH₂=CH₂（H が奪われる）</li>
</ul>
<p>メタン → メタノール → ホルムアルデヒド → ギ酸 → CO₂ と、段階的に酸化が進む。</p>
<p class="slide">対応スライド：第3回 p.3〜6</p>`},

{t:'自由エネルギー',html:`
<h2>反応の向きを決める ΔG</h2>
<p class="lead">反応は<b>自由エネルギーが減る向き（ΔG < 0）</b>に進み、やがて化学平衡（ΔG = 0）に達する。</p>
<div class="note">酵素は<b>活性化エネルギーを下げる</b>だけ。平衡の位置は変えられない（正反応も逆反応も同じだけ速くする）。</div>
<h3>共役反応</h3>
<p>ΔG > 0 の起こりにくい反応も、もっと大きく負の ΔG をもつ反応と<b>組み合わせれば</b>進む。</p>
<div class="formula">グルコース + フルクトース → スクロース　ΔG° = +23 kJ/mol<br>ATP → ADP + Pᵢ　ΔG° = −30.5 kJ/mol<br>合わせて 23 − 30.5 = −7.5 kJ/mol → 進む</div>
<h3>標準自由エネルギー変化 ΔG°</h3>
<p>25 °C・1気圧・すべての濃度 1 M（pH 7）での値。実際の ΔG は濃度で変わる。</p>
<div class="formula">ΔG = ΔG° + RT ln([X]/[Y])　（Y → X の反応）</div>
<p>例（kJ/mol）：グルコース1リン酸 → グルコース6リン酸 −7.3、スクロース → グルコース＋フルクトース −2.3、ATP → ADP + Pᵢ −30.5、グルコース + 6O₂ → 6CO₂ + 6H₂O −2867。</p>
<h3>問題3-8：細胞内の ATP の加水分解</h3>
<div class="formula">ΔG = −30.5 + 2.58 ln([ADP][Pᵢ]/[ATP]) ≈ −50 kJ/mol<small>37 °C で RT = 2.58 kJ/mol。細胞内では 46〜54 kJ/mol 放出</small></div>
<p>ATP は mM、ADP は 10 µM 程度で、[ADP][Pᵢ]/[ATP] が 1 よりずっと小さい → 対数が負 → ΔG は ΔG° より<b>大きく負</b>。濃度は細胞ごとにちがうので、ΔG も細胞ごとにちがう。</p>
<h3>平衡定数との関係</h3>
<div class="formula">平衡では ΔG = 0 → ΔG° = −RT ln K<small>37 °C では ΔG° = −5.9 log K（kJ/mol）。ΔG° が 5.9 kJ/mol 負になるごとに K は 10 倍</small></div>
<div class="tblwrap"><table class="tbl">
<tr><th>K</th><th>1</th><th>10</th><th>100</th><th>1000</th></tr>
<tr><td>ΔG°（kJ/mol）</td><td>0</td><td>−5.9</td><td>−11.9</td><td>−17.8</td></tr>
</table></div>
<p>結合反応 A + B ⇄ AB の K = [AB]/[A][B] も同じように考えられる。</p>
<p class="slide">対応スライド：第3回 p.7〜12</p>`},

{t:'酵素の速さ',html:`
<h2>酵素反応の速さ：ミカエリス・メンテン式</h2>
<p class="lead">酵素と基質は<b>熱運動による拡散</b>で出会う（小分子は 0.2 秒で 10 µm 動く）。</p>
<div class="formula">E + S ⇄ ES → E + P　（k₁、k₋₁、k₂）</div>
<div class="formula">v = V_max [S] / ([S] + K_M)</div>
<div class="defs">
<div><span class="k">V_max</span><span>最大反応速度（基質がたくさんあるとき）。V_max = k₂[E]_T</span></div>
<div><span class="k">K_M</span><span><b>ミカエリス定数</b>。v が V_max の<b>半分</b>になる基質濃度。K_M = (k₋₁ + k₂)/k₁。<b>K_M が大きいほど基質との結合が弱い</b></span></div>
<div><span class="k">k_cat</span><span><b>代謝回転数</b>。1個の酵素が1秒間に反応を行う回数</span></div>
</div>
<p>導き方：ES の濃度が一定（<b>定常状態</b> d[ES]/dt = 0）と、酵素の総量 [E]_T = [E] + [ES] を使う。</p>
<h3>二重逆数プロット（ラインウィーバー・バーク）</h3>
<div class="formula">1/v = (K_M/V_max)(1/[S]) + 1/V_max</div>
<p>1/[S] を横軸、1/v を縦軸にすると直線になる。<b>縦軸の切片 = 1/V_max</b>、<b>横軸の切片 = −1/K_M</b>、傾き = K_M/V_max。</p>
<p class="slide">対応スライド：第3回 p.13〜15</p>`},

{t:'活性運搬体',html:`
<h2>活性運搬体：エネルギーの運び屋</h2>
<p class="lead">有機分子の酸化で得たエネルギーは、<b>活性運搬体</b>の形でたくわえられる。<b>高エネルギー結合</b>や<b>高エネルギーの電子</b>といった、使いやすい形で運ぶ。異化と同化の仲立ちをする「シャトル」。</p>
<div class="tblwrap"><table class="tbl">
<tr><th>活性運搬体</th><th>運ぶもの</th></tr>
<tr><td>ATP</td><td>リン酸基</td></tr>
<tr><td>NADH・NADPH・FADH₂</td><td>電子と水素</td></tr>
<tr><td>アセチル CoA</td><td>アセチル基</td></tr>
<tr><td>カルボキシル化ビオチン</td><td>カルボキシ基</td></tr>
<tr><td>S-アデノシルメチオニン</td><td>メチル基</td></tr>
<tr><td>UDP-グルコース</td><td>グルコース</td></tr>
</table></div>
<h3>ATP</h3>
<ul>
<li>リン酸どうしが<b>リン酸無水結合</b>でつながっている。加水分解でエネルギーを放出</li>
<li>脱水縮合を進める：まず ATP で基質を<b>リン酸化</b>（活性化段階）→ 縮合段階。例：グルタミン酸 + NH₃ → グルタミン</li>
<li>多糖・核酸・タンパク質の合成は、ヌクレオシド三リン酸の加水分解で進む。DNA 合成では<b>ピロリン酸</b>の加水分解が反応を押し進める</li>
</ul>
<h3>NADPH</h3>

ch:[
{t:'一次構造と主鎖',html:`
<h2>タンパク質はアミノ酸の鎖</h2>
<ul>
<li><b>アミノ酸</b>が<b>ペプチド結合（アミド結合）</b>で<b>特定の配列</b>につながったもの</li>
<li>アミノ基がある端を <b>N 末端</b>、カルボキシ基がある端を <b>C 末端</b>と呼ぶ</li>
</ul>
<h3>主鎖の形を決めるもの</h3>
<ul>
<li>主鎖には <b>φ・ψ・ω の3つの二面角</b>（ねじれ角）がある</li>
<li>ペプチド結合は共鳴で<b>二重結合性</b>をもつので回転できず、ほとんどが<b>トランス型</b>（ω は固定）</li>
<li>主鎖の形はほぼ <b>φ と ψ</b> で決まる（ラマチャンドラン図で許される範囲を示す）</li>
</ul>
<h3>折りたたみ（フォールディング）</h3>
<p>分子内の<b>非共有結合</b>（静電引力・水素結合・ファンデルワールス力）と疎水効果で、特定の3次元構造に折りたたまる。極性の側鎖は表面に、非極性の側鎖は内部（疎水性のコア）に集まる。</p>
<h3>一次構造が立体構造を決める</h3>
<ul>
<li>アミノ酸の並び（<b>一次構造</b>）で3次元構造が決まる。尿素で変性させても、尿素を除くと元の形に戻る</li>
<li>ただし、どんな配列でも決まった形に折りたたまるわけではない</li>
<li><b>シャペロン</b>が正しい折りたたみを助ける（ATP が必要。中に閉じ込める「隔離容器」型もある）</li>
</ul>
<p class="slide">対応スライド：第4回 p.3〜7</p>`},

{t:'二次〜四次構造',html:`
<h2>二次構造から四次構造へ</h2>
<h3>α ヘリックス</h3>
<ul>
<li><b>3.6 アミノ酸</b>で1巻きの<b>右巻き</b>らせん</li>
<li>ある残基の<b>カルボニル酸素</b>が、C 末端側<b>4残基先のアミド水素</b>と<b>水素結合</b>する</li>
<li>膜を貫くタンパク質は、疎水性のαヘリックス（約20アミノ酸）で脂質二重層を横切ることが多い</li>
</ul>
<h3>β シート</h3>
<ul>
<li><b>並んだ2本のポリペプチド鎖</b>の間で<b>水素結合</b>ができた構造</li>
<li>向きが逆の<b>逆平行βシート</b>と、同じ向きの<b>平行βシート</b>がある</li>
</ul>
<h3>三次構造</h3>
<p>複数の<b>二次構造</b>や<b>天然変性領域</b>（決まった形をとらない部分）が集まってできる全体の形。進化で、似た三次構造のまま別の働きをするタンパク質が生まれた（エラスターゼとキモトリプシンなど）。</p>
<h3>四次構造</h3>
<p><b>複数のポリペプチド鎖</b>（サブユニット）が集まったもの。例：ヘモグロビンは α グロビン2本＋β グロビン2本で、それぞれにヘムがあり、1分子で酸素を4つ運ぶ。同じサブユニットが集まって繊維・らせん・環・中空の管・球状の殻もつくる。</p>
<h3>ジスルフィド結合</h3>
<p><b>システイン</b>の側鎖（−SH）どうしが共有結合（−S−S−）して構造を安定にする。<b>酸化で結合、還元で切断</b>（可逆）。</p>
<p class="slide">対応スライド：第4回 p.8〜12</p>`},

{t:'構造予測とはたらき',html:`
<h2>構造予測・酵素・抗体・修飾</h2>
<h3>閑話休題：構造予測と設計</h3>
<ul>
<li>David Baker の <b>Rosetta</b>：フラグメントアセンブリ法で構造予測の精度を大きく上げた（CASP で成功）。天然にない形のタンパク質 Top7 を設計。インフルエンザを阻害するタンパク質の設計、ゲーム Foldit で一般の人も参加</li>
<li>Google（DeepMind）の <b>AlphaFold</b>：アミノ酸配列から3次元構造を正確に予測。<b>AlphaFold3</b> は複合体の構造まで予測</li>
</ul>
<h3>タンパク質の例</h3>
<div class="defs">
<div><span class="k">酵素</span><span>基質ポケットで<b>複数のアミノ酸側鎖が協同的に</b>反応を触媒する（リゾチームが多糖を切る例）</span></div>
<div><span class="k">抗体</span><span><b>Y 字形</b>で、腕の先に抗原結合部位をもつ。重鎖2本＋軽鎖2本をジスルフィド結合でつなぐ</span></div>
</div>
<h3>翻訳後修飾</h3>
<p>タンパク質は、<b>リン酸化・アセチル化・メチル化</b>などの修飾を受けて働きを変える。</p>
<ul>
<li>リン酸化：<b>キナーゼ</b>が ATP のリン酸をセリンなどの側鎖に付け、<b>ホスファターゼ</b>が外す。オン／オフのスイッチ</li>
<li>GTP 結合タンパク質：GTP が結合するとオン、GDP に加水分解されるとオフ</li>
</ul>
<p class="slide">対応スライド：第4回 p.13〜20</p>`},

{t:'研究方法',html:`
<h2>タンパク質を調べる方法</h2>
<div class="flow">
<div>細胞を<b>壊す</b>（超音波・界面活性剤・高圧・すりつぶし）→ ホモジェネート</div>
<div><b>遠心分離</b>で画分に分ける（速度を上げるごとに：核・細胞骨格 → ミトコンドリア → 小胞 → リボソーム）</div>
<div><b>クロマトグラフィー</b>で化学的性質に基づいて分ける（イオン交換・ゲルろ過・アフィニティー）</div>
<div><b>電気泳動</b>で分析する（SDS-PAGE、等電点電気泳動、二次元電気泳動）</div>
</div>
<ul>
<li><b>プロテアーゼ処理・質量分析</b>でアミノ酸配列が分かる（トリプシンで切ったペプチドの質量をデータベースと照合）</li>
<li><b>X 線結晶構造解析</b>：原子レベルで構造を決める（結晶が必要）</li>
<li><b>NMR（核磁気共鳴）法</b>：<b>溶液中</b>の構造を決める（小さいタンパク質向き）</li>
<li>低温電子顕微鏡法：大きな複合体の構造も分かる</li>
<li>遺伝子工学で、タンパク質を改変したり大量に発現させたりできる</li>
</ul>
<p class="slide">対応スライド：第4回 p.21〜26</p>`}

{t:'DNAの構造',html:`
<h2>DNA 二重らせん</h2>
<p class="lead">1953年、<b>ワトソンとクリック</b>が DNA 二重らせんモデルを提案し、遺伝の化学的な実体が明らかになった。</p>
<ul>
<li>DNA は4種類の<b>ヌクレオチド</b>がつながったもの</li>
<li>デオキシリボースの <b>5′-OH 側を 5′ 末端</b>、<b>3′-OH 側を 3′ 末端</b>と呼ぶ</li>
<li>ヌクレオチドどうしはリン酸ジエステル結合でつながる</li>
</ul>
<h3>塩基対</h3>
<ul>
<li><b>A と T、G と C</b> が<b>水素結合</b>で<b>塩基対</b>をつくる（ワトソン・クリック塩基対）</li>
<li>A−T は<b>水素結合2つ</b>、G−C は<b>3つ</b></li>
<li>2本の鎖は<b>逆平行</b>の二本鎖</li>
<li><b>相補的な塩基対</b>によって、遺伝情報を<b>保存・複製</b>できる</li>
</ul>
<h3>らせんの形</h3>
<p><b>10 塩基対で1巻き</b>の右巻き二重らせん（B-DNA）。直径 2 nm、塩基対の間隔 0.34 nm。表面には<b>主溝</b>と<b>副溝</b>がある。</p>
<h3>DNA と RNA のちがい</h3>
<div class="duo">
<div><strong>DNA</strong><span>糖：デオキシリボース</span><span>塩基：A・T・G・C</span></div>
<div><strong>RNA</strong><span>糖：リボース</span><span>塩基：A・U・G・C</span><span>DNA から RNA ポリメラーゼで<b>転写</b>される</span></div>
</div>
<div class="note">閑話休題：水素結合をもたない「形だけまねた」人工塩基対（Kool の Z−F）でも複製されることから、塩基対には水素結合だけでなく<b>形の相補性</b>も重要だと分かった。</div>
<p class="slide">対応スライド：第5回 p.3〜8</p>`},

{t:'遺伝子と染色体',html:`
<h2>遺伝子・染色体・クロマチン</h2>
<h3>遺伝子</h3>
<ul>
<li>真核生物の遺伝子は<b>ゲノム</b>のほんの一部（ヒトのゲノムは約30億塩基対で、遺伝子はそのうち1〜2%）</li>
<li>遺伝子は <b>RNA</b> へ<b>転写</b>され、<b>タンパク質</b>に<b>翻訳</b>される（RNA が最終産物の遺伝子もある）</li>
</ul>
<h3>染色体</h3>
<p>真核生物のとても長い DNA は<b>染色体</b>としてまとまり、<b>核</b>の中に入っている。各染色体の DNA には次の3つがある。</p>
<div class="defs">
<div><span class="k">複製起点</span><span>DNA の複製が始まる場所。<b>多数</b>ある</span></div>
<div><span class="k">テロメア</span><span>両端にあり、末端の複製を助ける</span></div>
<div><span class="k">セントロメア</span><span>細胞分裂のとき、染色体を娘細胞に分配するのに使われる</span></div>
</div>
<h3>ヌクレオソームとクロマチン</h3>
<ul>
<li><b>ヒストン八量体</b>（H2A・H2B・H3・H4 が2個ずつ）に <b>DNA 二本鎖</b>が巻きついた構造が<b>ヌクレオソーム</b>（約147塩基対が約2回巻き）</li>
<li>ヒストンなどのタンパク質と DNA の複合体をまとめて<b>クロマチン</b>と呼ぶ</li>
<li>2 nm の二重らせん → 11 nm の「糸に通したビーズ」→ 30 nm 線維 → ループ（700 nm）→ 分裂期染色体（1400 nm）と何段階も凝縮する。分裂期染色体の長さは伸ばした DNA の約1万分の1</li>
</ul>
<p class="slide">対応スライド：第5回 p.9〜11</p>`},

{t:'エピジェネティクス',html:`
<h2>クロマチンの変化と遺伝子発現</h2>

<h3>エピジェネティクス</h3>
<p>DNA の配列を変えずに、<b>ヒストンと DNA が修飾</b>されることで遺伝子発現が制御されるしくみ。</p>

<h3>ヘテロクロマチンとユークロマチン</h3>

</div>
<p class="slide">対応スライド：第5回 p.12〜15</p>`}

  $('toc').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{ui.ch=+b.dataset.c;saveUI();renderLearn();window.scrollTo({top:0})});
  const on=$('toc').querySelector('[aria-pressed="true"]');if(on)on.scrollIntoView({block:'nearest',inline:'center'});
  $('lesson').innerHTML=`<article class="card lesson" style="--c:${cc}"><p class="meta"><span class="tag" style="--c:${cc}">${lec.date} ${lec.title}</span><span class="count">${ui.ch+1} / ${lec.ch.length}</span></p>${c.html}<button class="dunno" id="ldunno" data-ai ${sampleFn?'':'hidden'}>この章、分からない</button><div class="help" id="lhelp" hidden><label for="lq">どこが分からない？（空欄のままでもOK）</label><textarea id="lq" placeholder="例：この式の記号が何を表しているのかピンとこない"></textarea><button class="ask" id="lask">やさしく説明して</button><div class="ai" id="lout" hidden></div></div><button class="go" id="goDrill">この章の問題を解く（${n}問）</button></article>`;
  $('ldunno').onclick=()=>{$('ldunno').hidden=true;$('lhelp').hidden=false;$('lq').focus()};
  $('lask').onclick=()=>{
    const tmp=document.createElement('div');tmp.innerHTML=c.html;
    const text=tmp.textContent.replace(/\s+\n/g,'\n').slice(0,5000),q=$('lq').value.trim();
    ask(`${persona()}以下の入門テキスト（${lec.title}）を読んでも分からなかったそうです。

---
${text}
---

分からないところ：${q||'（具体的には書かれていない。章全体がピンときていない）'}

テキストの内容から外れずに、身近なたとえを使って、やさしい日本語で300〜450字で説明してください。式が出てくる場合は、記号がそれぞれ何を表すかを言葉で説明してください。見出しや**などのマークダウン記号は使わないでください。`,$('lout'),$('lask'));
  };
  $('goDrill').onclick=()=>{scope=lec.id;topic=ui.ch;filter='all';started=true;deck=[];setModeDrillFresh()};
  $('score').innerHTML=`<b>${ui.ch+1}</b> / ${lec.ch.length}<br>章`;
  const last=ui.ch===lec.ch.length-1,ls=subjLecs(ui.subj),nextLec=ls[ls.indexOf(lec)+1];
  $('bar').innerHTML=(ui.ch>0?`<button class="ghost" id="prev">← 前の章</button>`:'')+
    (last&&nextLec?`<button class="ghost" id="nextlec">次の回へ →</button>`:'')+
    `<button class="next" id="nextch">${last?'この回のドリルへ':'次の章へ'}</button>`;
  if(ui.ch>0)$('prev').onclick=()=>{ui.ch--;saveUI();renderLearn();window.scrollTo({top:0})};
  if(last&&nextLec)$('nextlec').onclick=()=>{ui.lec=nextLec.id;ui.ch=0;saveUI();renderLecs();renderLearn();window.scrollTo({top:0})};
  $('nextch').onclick=()=>{if(last){scope=lec.id;topic='all';filter='all';setModeDrillFresh()}else{ui.ch++;saveUI();renderLearn();window.scrollTo({top:0})}};
}
function setModeDrillFresh(){started=true;log=[];ui.mode='drill';saveUI();
  $('tab-learn').setAttribute('aria-selected','false');$('tab-drill').setAttribute('aria-selected','true');
  $('learn').hidden=true;$('drill').hidden=false;renderLecs();chips();start();window.scrollTo({top:0})}

// ---------- 「分からない」→ Claude にやさしく説明してもらう ----------
let sampleFn=null;
(async()=>{try{if(window.claude&&typeof claude.use==='function')sampleFn=await claude.use('sample')}catch(e){}
  document.querySelectorAll('[data-ai]').forEach(b=>b.hidden=!sampleFn)})();
const HIDE=new Set(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed']);
const aiErr=c=>({not_granted:'Claude への質問が許可されなかったので、この機能は使えません。',sampling_disabled:'このアカウントでは Claude に質問できません。',rate_limited:'質問が続いたので、少し時間をおいてもう一度押してね。',session_expired:'サインインし直してからもう一度押してね。',refused:'この聞き方では答えられなかった。書き方を変えてみて。'}[c]||'うまく受け取れなかった。もう一度押してみて。');
const clean=s=>s.replace(/\*\*/g,'').replace(/^#+\s*/gm,'');
const persona=()=>SUB[ui.subj].persona;
async function ask(prompt,out,btn){
  if(!sampleFn)return;
  const again=btn.dataset.again==='1';
  btn.disabled=true;out.hidden=false;out.className='ai wait';out.textContent='考え中…';
  try{
    const {text,truncated}=await sampleFn(again?prompt+'\n\n前回とは違うたとえを使ってください。':prompt,{modelTier:'quick',cache:again?false:true,onText:({text})=>{out.className='ai';out.textContent=clean(text)}});
    out.className='ai';out.textContent=clean(text)+(truncated?'\n（途中で切れました）':'');
    btn.textContent='別の言い方で説明して';btn.dataset.again='1';
  }catch(e){
    out.className='ai wait';out.textContent=(e.text?clean(e.text)+'\n\n':'')+(e.code==='cancelled'?'':aiErr(e.code));
    if(HIDE.has(e.code)){sampleFn=null;btn.hidden=true}
  }finally{btn.disabled=false}
}
function helpHTML(d){
  return `<div class="help"><div class="row"><button id="aiBtn" data-ai ${sampleFn?'':'hidden'}>もっとやさしく説明して</button><button id="toCh">${LEC[d.lec].date}「${d.ch+1}. ${chName(d.lec,d.ch)}」を読む</button></div><div class="ai" id="aiOut" hidden></div></div>`;
}
function wireHelp(d,picked){
  $('toCh').onclick=()=>{if(cur&&cur.done)pos++;ui.lec=d.lec;ui.ch=d.ch;saveUI();setMode('learn')};
  $('aiBtn').onclick=()=>ask(`${persona()}次の確認問題（${LEC[d.lec].title}）が分からなかったそうです。

問題：${d.q}
正解：${d.c?d.c[0]:d.a}
${d.e?'教科書的な解説：'+d.e+'\n':''}${picked?'学生が選んだ答え：'+picked:'学生は答えずに「分からない」を押しました。'}

なぜこの答えになるのかを、身近なたとえを1つ使って、やさしい日本語で200〜300字で説明してください。${picked?'選んだ答えがなぜ違うのかにも一言ふれてください。':''}最後に「ひとことで：」で始まる1行のまとめをつけてください。見出しや**などのマークダウン記号は使わないでください。`,$('aiOut'),$('aiBtn'));
}

// ---------- ドリル ----------
const inScope=d=>d.subj===ui.subj&&(scope==='all'||d.lec===scope)&&(scope==='all'||topic==='all'||d.ch===topic);
function pool(){return D.filter(d=>inScope(d)&&(filter==='all'||(filter==='weak'?mem[d.id]===0:mem[d.id]===undefined)))}
function start(list){started=true;deck=shuffle(list||pool());pos=0;log=[];if(ui.mode==='drill')render()}

function filterCounts(){const s=D.filter(inScope);return{weak:s.filter(d=>mem[d.id]===0).length,fresh:s.filter(d=>mem[d.id]===undefined).length}}
function chips(){
  const n=filterCounts();
  const chs=scope==='all'?'':[`<button class="chip" data-t="all" aria-pressed="${topic==='all'}">全部</button>`].concat(
    LEC[scope].ch.map((x,i)=>`<button class="chip" style="--c:${col(i)}" data-t="${i}" aria-pressed="${topic===i}"><i></i><span class="n">${i+1}</span>${x.t}</button>`)).join('');
  $('chips').innerHTML=chs+
    `<button class="chip weak" data-f="weak" aria-pressed="${filter==='weak'}">苦手だけ <span class="n" id="nWeak">${n.weak}</span></button>`+
    `<button class="chip" data-f="new" aria-pressed="${filter==='new'}">未回答だけ <span class="n" id="nNew">${n.fresh}</span></button>`;
  $('chips').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{topic=b.dataset.t==='all'?'all':+b.dataset.t;if(topic!=='all'){ui.ch=topic;saveUI()}chips();start()});
  $('chips').querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filter=filter===b.dataset.f?'all':b.dataset.f;chips();start()});
  const on=$('chips').querySelector('[data-t][aria-pressed="true"]');if(on&&!$('drill').hidden)on.scrollIntoView({block:'nearest',inline:'center'});
}
// 解答のたびに数字だけ更新する（チップを作り直すとスクロール位置が動くため）
function updateCounts(){const n=filterCounts();if($('nWeak'))$('nWeak').textContent=n.weak;if($('nNew'))$('nNew').textContent=n.fresh}

function drawChrom(){
  const n=Math.max(deck.length,1),W=300,base=43,s=Math.max(W/n*0.22,1.4);
  const peaks=log.map(r=>({x:(r.pos+.5)/n*W,h:r.ok?36:13,s,ok:r.ok}));
  const bad=peaks.filter(p=>!p.ok).map(p=>`<circle cx="${p.x}" cy="${base-15}" r="2.2" fill="var(--bad)"/>`).join('');
  $('chrom').innerHTML=`<path d="${gauss(peaks,W,base,40)}" fill="none" stroke="var(--accent)" stroke-width="1.4" vector-effect="non-scaling-stroke"/>${bad}`;
}
function score(){
  if(ui.mode!=='drill')return;
  const ok=log.filter(r=>r.ok).length;
  $('score').innerHTML=`<b>${ok}</b> / ${log.length} 正解<br>残り ${Math.max(deck.length-pos,0)} 問`;
}
function record(ok){mem[cur.id]=ok?1:0;save();log.push({id:cur.id,pos,ok});cur.done=true;drawChrom();score();bar();updateCounts()}

function render(){
  drawChrom();score();
  if(!deck.length){
    const msg=filter==='weak'?['この範囲の苦手問題はありません。','「苦手だけ」を外すと全問から出題します。']:filter==='new'?['この範囲はぜんぶ解きました。','「未回答だけ」を外すと全問から出題します。']:['この範囲にはまだ問題がありません。',''];
    $('main').innerHTML=`<section class="card"><p class="q">${msg[0]}</p><p class="exp">${msg[1]}</p></section>`;$('bar').innerHTML='';return}
  if(pos>=deck.length)return summary();
  const d=deck[pos];cur={id:d.id,done:false};const cc=col(d.ch);
  const body=d.c
    ?`<div class="opts">${shuffle(d.c).map((o,i)=>`<button class="opt" data-ok="${o===d.c[0]?1:0}" data-v="${esc(o)}"><span class="k">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div><button class="dunno" id="dk">分からない</button><div id="after"></div>`
    :`<div class="revrow" id="revrow"><button class="dunno" id="dk">分からない</button><button class="reveal" id="rev">答えを見る</button></div><div id="after"></div>`;
  $('main').innerHTML=`<section class="card"><div class="meta"><span class="tag" style="--c:${cc}">${tagLabel(d)}</span><span class="count">${pos+1} / ${deck.length}</span></div><p class="q">${esc(d.q)}</p>${body}</section>`;
  const exp=d.e?`<div class="exp">${esc(d.e)}</div>`:'';
  if(d.c){
    const finish=b=>{
      if(cur.done)return;const ok=!!b&&b.dataset.ok==='1';
      $('main').querySelectorAll('.opt').forEach(o=>{o.disabled=true;if(o.dataset.ok==='1')o.classList.add('right');else if(o!==b)o.classList.add('dim')});
      if(b&&!ok)b.classList.add('wrong');
      $('dk').remove();
      $('after').outerHTML=exp+(ok?'':helpHTML(d));
      if(!ok)wireHelp(d,b?b.dataset.v:null);
      record(ok);
    };
    $('main').querySelectorAll('.opt').forEach(b=>b.onclick=()=>finish(b));
    $('dk').onclick=()=>finish(null);
  }else{
    const show=extra=>{$('revrow').remove();$('after').outerHTML=`<div class="ans">${esc(d.a)}</div>${exp}${extra}`};
    $('rev').onclick=()=>{
      show(`<div class="self" id="self"><button class="n" id="sn">まだ曖昧</button><button class="y" id="sy">言えた</button></div><div id="after"></div>`);
      $('sy').onclick=()=>{$('self').remove();record(true)};
      $('sn').onclick=()=>{$('self').remove();$('after').outerHTML=helpHTML(d);wireHelp(d,null);record(false)};
    };
    $('dk').onclick=()=>{show(helpHTML(d));wireHelp(d,null);record(false)};
  }
  bar();window.scrollTo({top:0});
}
function bar(){
  if(ui.mode!=='drill'||pos>=deck.length)return;
  const last=pos===deck.length-1;
  $('bar').innerHTML=cur.done?`<button class="next" id="nx">${last?'結果を見る':'次へ'}</button>`:`<button class="next skip" id="nx">スキップ</button>`;
  $('nx').onclick=()=>{pos++;render()};
}
function summary(){
  const ok=log.filter(r=>r.ok).length,pct=log.length?Math.round(ok/log.length*100):0;
  // このセットで解いた問題だけを、全範囲なら回ごと・回の中なら章ごとに集計する
  const byId={};D.forEach(d=>byId[d.id]=d);
  const by={};log.forEach(r=>{const d=byId[r.id],k=scope==='all'?d.lec:d.ch;by[k]=by[k]||[0,0];by[k][1]++;if(r.ok)by[k][0]++});
  const label=k=>scope==='all'?`<span class="tag" style="--c:var(--fg)">${LEC[k].date} ${LEC[k].short}</span>`:`<span class="tag" style="--c:${col(+k)}">${+k+1}. ${chName(scope,+k)}</span>`;
  const keys=Object.keys(by).sort((a,b)=>scope==='all'?a.localeCompare(b):a-b);
  const wrong=log.filter(r=>!r.ok).map(r=>byId[r.id]);
  $('main').innerHTML=`<section class="card sum"><p class="meta"><span>このセットの結果</span></p><h2>${pct}%</h2><p>${log.length} 問中 ${ok} 問正解${deck.length>log.length?`（スキップ ${deck.length-log.length}）`:''}</p>
  <div class="rows">${keys.map(k=>`<div>${label(k)}<span>${by[k][0]} / ${by[k][1]}</span></div>`).join('')}</div></section>`;
  $('bar').innerHTML=(wrong.length?`<button class="ghost" id="rw">間違えた ${wrong.length} 問</button>`:'')+`<button class="next" id="ag">もう一周</button>`;
  $('ag').onclick=()=>start();
  if(wrong.length)$('rw').onclick=()=>start(wrong);
  renderLecs();window.scrollTo({top:0});
}

header();renderSubjs();
setMode(ui.mode==='drill'?'drill':'learn');
</script>

</body>
</html>

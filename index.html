<style>
/* Layout: one-thumb study app. Lecture row on top, two tabs (read first / drill), content card in the middle, big action bar pinned to the bottom. Chapter colors follow Tswett's pigment bands. */
:root{
  --bg:#EDF1EB; --surface:#F9FBF7; --fg:#15201A; --muted:#58665D; --line:#C9D3CA;
  --accent:#1E7550; --accent-fg:#F4FBF6; --accent-soft:#D6EADD;
  --ok:#1F8048; --ok-bg:#DDF0E2; --bad:#B83A26; --bad-bg:#F7DFD9;
  --t-base:#6E7A45; --t-gc:#16806E; --t-det:#4A8F2A; --t-lc:#A87C00; --t-ion:#C25A14; --t-calc:#4F5F9E; --t-graph:#2F6F9E; --t-tlc:#8A5BA8;
  --f-display:"Dela Gothic One","Hiragino Sans","Noto Sans JP",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1512; --surface:#18201B; --fg:#E6EEE8; --muted:#97A59C; --line:#2E3A33;
  --accent:#4FC28C; --accent-fg:#06140D; --accent-soft:#1B3528;
  --ok:#5BCB85; --ok-bg:#163223; --bad:#F08A73; --bad-bg:#3A1D17;
  --t-base:#AEBB7E; --t-gc:#4CC7B0; --t-det:#8CCB62; --t-lc:#E2B93A; --t-ion:#F0955A; --t-calc:#93A3E6; --t-graph:#7DB6E3; --t-tlc:#C39BE0;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1512; --surface:#18201B; --fg:#E6EEE8; --muted:#97A59C; --line:#2E3A33;
  --accent:#4FC28C; --accent-fg:#06140D; --accent-soft:#1B3528;
  --ok:#5BCB85; --ok-bg:#163223; --bad:#F08A73; --bad-bg:#3A1D17;
  --t-base:#AEBB7E; --t-gc:#4CC7B0; --t-det:#8CCB62; --t-lc:#E2B93A; --t-ion:#F0955A; --t-calc:#93A3E6; --t-graph:#7DB6E3; --t-tlc:#C39BE0;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.7;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px calc(96px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
h1{font-family:var(--f-display);font-weight:400;font-size:1.6rem;line-height:1.1;margin:0;letter-spacing:.02em}
.sub{font-size:.78rem;color:var(--muted);margin-top:4px}
.sub b{font-family:var(--f-mono);font-weight:500;color:var(--fg);font-size:.95rem}
.score{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;font-size:.82rem;color:var(--muted);white-space:nowrap;line-height:1.5}
.score b{font-size:1.25rem;color:var(--fg);font-weight:500}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;gap:4px}
.tabs button{font:inherit;font-weight:700;border:0;border-radius:7px;min-height:42px;background:transparent;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.strip{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px 2px}
.strip svg{display:block;width:100%;height:46px}
.strip .axis{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.62rem;color:var(--muted);letter-spacing:.04em}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-size:.82rem;font-weight:700;border:1.5px solid var(--line);background:transparent;color:var(--fg);
  border-radius:999px;padding:6px 13px;display:flex;align-items:center;gap:6px;cursor:pointer;min-height:36px;line-height:1.3}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--muted))}
.chip .n{font-family:var(--f-mono);font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip[aria-pressed="true"] .n{color:var(--bg)}
.chip.weak[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.chip.weak[aria-pressed="true"] .n{color:var(--surface)}
.subjs .chip{font-size:.9rem;padding:6px 15px}
.lecs .chip{border-radius:8px;flex-direction:column;align-items:flex-start;gap:0;padding:6px 12px;min-height:48px}
.lecs .chip .d{font-family:var(--f-mono);font-weight:500;font-size:.72rem;color:var(--muted)}
.lecs .chip[aria-pressed="true"] .d{color:var(--bg)}
.lecs .chip .bar2{display:block;width:100%;height:3px;border-radius:2px;background:var(--line);margin-top:4px;overflow:hidden}
.lecs .chip .bar2 span{display:block;height:100%;background:var(--ok)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.74rem;letter-spacing:.06em;color:var(--muted);margin:0}
.tag{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--c)}
.tag::before{content:"";flex:none;width:22px;height:6px;border-radius:3px;background:var(--c)}
.count{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.q{font-size:1.08rem;font-weight:700;line-height:1.6;margin:0;text-wrap:pretty;white-space:pre-line}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{font:inherit;text-align:left;background:var(--bg);color:var(--fg);border:1.5px solid var(--line);border-radius:8px;
  padding:12px 14px;min-height:52px;cursor:pointer;line-height:1.5;display:flex;gap:10px;align-items:flex-start}
.opt .k{font-family:var(--f-mono);color:var(--muted);flex:none;width:1.1em}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .k{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .k{color:var(--bad)}
.opt.dim{opacity:.55}
.reveal{font:inherit;font-weight:700;border:1.5px dashed var(--line);background:transparent;color:var(--fg);border-radius:8px;min-height:64px;cursor:pointer}
.ans{border-left:4px solid var(--accent);padding:2px 0 2px 12px;font-weight:700;white-space:pre-line}
.exp{font-size:.9rem;color:var(--muted);white-space:pre-line;border-top:1px solid var(--line);padding-top:12px}
.self{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.self button{font:inherit;font-weight:700;border-radius:8px;min-height:52px;cursor:pointer;border:1.5px solid}
.self .y{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.self .n{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);
  border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.next{flex:1;font:inherit;font-weight:700;font-size:1.05rem;min-height:56px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-fg);cursor:pointer}
.next.skip{background:transparent;color:var(--muted);border:1.5px solid var(--line)}
.ghost{font:inherit;font-size:.85rem;font-weight:700;min-height:56px;padding:0 16px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.sum h2{font-family:var(--f-display);font-weight:400;font-size:2.4rem;margin:0;font-variant-numeric:tabular-nums}
.sum p{margin:0;color:var(--muted)}
.rows{display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.rows div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.rows span:last-child{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}

/* lesson */
.lesson{gap:16px}
.lesson h2{font-family:var(--f-display);font-weight:400;font-size:1.45rem;line-height:1.3;margin:0;text-wrap:balance}
.lesson h3{font-size:1rem;margin:6px 0 0;display:flex;align-items:center;gap:8px}
.lesson h3::before{content:"";flex:none;width:4px;height:1.05em;border-radius:2px;background:var(--c,var(--accent))}
.lesson p{margin:0}
.lesson b{background:linear-gradient(transparent 60%,var(--accent-soft) 60%);font-weight:700}
.lesson ul,.lesson ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.lead{font-size:1.02rem}
.slide{font-size:.76rem;color:var(--muted);letter-spacing:.03em;border:1px dashed var(--line);border-radius:6px;padding:6px 10px}
.fig{margin:0;background:var(--bg);border-radius:8px;padding:10px 8px 8px;display:flex;flex-direction:column;gap:6px}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:.8rem;color:var(--muted);padding:0 4px}
.flow{display:flex;flex-direction:column;gap:0}
.flow div{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:.9rem}
.flow div b{background:none}
.flow div+div{margin-top:18px;position:relative}
.flow div+div::before{content:"↓";position:absolute;top:-19px;left:18px;color:var(--muted);font-size:.85rem}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.duo>div{background:var(--bg);border-radius:8px;padding:10px 12px;font-size:.86rem;line-height:1.6;min-width:0;display:flex;flex-direction:column;gap:4px}
.duo>div strong{font-size:.95rem}
.defs{display:flex;flex-direction:column;gap:10px}

.defs>div:last-child{border-bottom:0;padding-bottom:0}
.defs dt,.defs .k{font-family:var(--f-mono);font-weight:500;color:var(--c,var(--accent));font-size:.88rem}
.formula{font-family:var(--f-mono);font-size:.92rem;background:var(--bg);border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:nowrap}
.formula small{display:block;font-family:var(--f-body);color:var(--muted);font-size:.78rem;white-space:normal;margin-top:4px}
.tbl{width:100%;border-collapse:collapse;font-size:.84rem;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
.tbl th{color:var(--muted);font-weight:700;font-size:.78rem}
.tblwrap{overflow-x:auto}
.note{font-size:.88rem;background:var(--accent-soft);border-radius:8px;padding:10px 12px}
.go{font:inherit;font-weight:700;min-height:52px;border-radius:10px;border:1.5px solid var(--c,var(--accent));background:transparent;color:var(--c,var(--accent));cursor:pointer}
.dunno{font:inherit;font-weight:700;font-size:.92rem;min-height:48px;border-radius:8px;border:1.5px dashed var(--muted);background:transparent;color:var(--muted);cursor:pointer}
.revrow{display:grid;grid-template-columns:1fr 1.6fr;gap:9px}
.revrow .reveal{min-height:48px}
.help{display:flex;flex-direction:column;gap:10px;background:var(--accent-soft);border-radius:8px;padding:12px}
.help .row{display:flex;gap:8px;flex-wrap:wrap}
.help .row button,.help .ask{font:inherit;font-weight:700;font-size:.88rem;min-height:46px;padding:0 14px;border-radius:8px;border:1.5px solid var(--accent);background:var(--surface);color:var(--accent);cursor:pointer;flex:1 1 auto}
.help .ask{background:var(--accent);color:var(--accent-fg)}
.help button:disabled{opacity:.6;cursor:default}
.help label{font-size:.85rem;font-weight:700}
.help textarea{font:inherit;font-size:.95rem;width:100%;min-height:72px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--fg);resize:vertical}
.ai{white-space:pre-line;font-size:.95rem;line-height:1.8;background:var(--surface);border-radius:8px;padding:12px}

button:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.card{animation:in .22s ease-out}@keyframes in{from{transform:translateY(6px);opacity:.4}}}
</style>

<script>
// ---------- 図の部品（講義データより先に定義する） ----------
function gauss(peaks,W,base,clip){let d='';for(let x=0;x<=W;x+=1){let y=0;for(const p of peaks){const dx=x-p.x;if(Math.abs(dx)<p.s*4)y+=p.h*Math.exp(-dx*dx/(2*p.s*p.s))}d+=(x?'L':'M')+x+' '+(base-Math.min(y,clip||999)).toFixed(1)}return d}
const T='font-size="11" fill="var(--muted)" font-family="Zen Kaku Gothic New, sans-serif"';

// ---------- 教科と講義データ ----------
// SUBJ({id, name, short, exam:'YYYY-MM-DD', examLabel, persona}) で教科を登録する。
// L({subj, id, date, title, short, ch:[{t:章名, html:本文}], q:[[章番号(0始まり), 問題文, {c:[正解,誤答,誤答,誤答]} または {a:'答え'}, 解説], ...]})
// subj を省略すると分析化学（bunseki）。回の id は全教科で重複しないこと。
// 問題IDは「回のid-その回の中での位置」。正誤記録がずれるので、問題は各回の q の末尾にだけ足すこと。
const SUBJS=[],LECS=[];
const SUBJ=o=>SUBJS.push(o);
const L=o=>LECS.push(Object.assign({subj:'bunseki'},o));
</script>

// ===== 分析化学I =====
SUBJ({id:'bunseki',name:'分析化学I',short:'分析化学',exam:'2026-11-10',examLabel:'11/10（火）',
  persona:'あなたは分析化学の家庭教師です。相手は大学2年生で、授業の内容をまだよく理解できていない初心者です。'});

// ===== 10/2 分析化学入門・重量分析 =====
L({id:'1002',date:'10/2',title:'分析化学入門・重量分析',short:'入門・重量分析',
ch:[
{t:'分析化学とは',html:`
<h2>分析化学は「何が・どれだけ」を決める学問</h2>
<p class="lead">試料の中に<b>何が入っているか</b>を調べるのが<b>定性分析</b>、<b>どれだけ入っているか</b>を決めるのが<b>定量分析</b>。この授業のほとんどは定量の話。</p>
<h3>歴史をざっくり</h3>
<ul>
<li>アルキメデス：王冠に混ぜ物がないかを調べた（「ユーレカ！」）。分析の原型</li>
<li>17世紀：ボイルが『懐疑的化学者』で「Analyst（分析家）」という言葉を使う。<b>重量分析</b>が始まる</li>
<li>18〜19世紀：<b>容量分析（滴定）</b>。ゲイ・リュサックは銀の純度を 0.05% の精度で測った</li>
<li>ラボアジェ（分析化学の父）：はかりで質量保存則を示した</li>
<li>1894年 オストワルド：平衡定数で分析化学を理論的に説明</li>
<li>20世紀：機器分析の時代へ</li>
</ul>
<h3>方法によって得意な濃度がちがう</h3>
<div class="tblwrap"><table class="tbl">
<tr><th>方法</th><th>濃度範囲(M)</th><th>精度</th><th>選択性</th></tr>
<tr><td>重量分析</td><td>10⁻¹〜10⁻²</td><td>0.1%</td><td>よくない〜中</td></tr>
<tr><td>滴定</td><td>10⁻¹〜10⁻⁴</td><td>0.1〜1%</td><td>中</td></tr>
<tr><td>電位差</td><td>10⁻¹〜10⁻⁶</td><td>2%</td><td>優れている</td></tr>
<tr><td>クロマト</td><td>10⁻³〜10⁻⁹</td><td>2〜5%</td><td>優れている</td></tr>
</table></div>
<div class="note">古典的な方法（重量・滴定）は<b>濃い試料を高精度</b>で、機器分析は<b>薄い試料を高選択的</b>に測るのが得意、と覚えるとよい。</div>
<p class="slide">対応スライド：「分析化学とは」〜「分析法の比較」</p>`},

{t:'重量分析',html:`
<h2>重量分析：はかりで量る</h2>
<p class="lead">目的成分だけを<b>分離して重さを量り</b>、化学量論から量を求める方法。</p>
<div class="duo">
<div><strong>利点</strong><span>操作がシンプル</span><span>比較標準物質や検量線がいらない（<b>基準分析法</b>）</span><span>正確さ・精度に優れる</span></div>
<div><strong>欠点</strong><span>時間がかかる</span><span>選択性はあまりよくない</span></div>
</div>
<h3>沈殿法の手順</h3>
<div class="flow">
<div>試料を乾燥してひょう量</div>
<div>酸（HCl・HNO₃・H₂SO₄・HClO₄・HF）で溶かす</div>
<div>妨害成分を分離（溶媒抽出・マスキング・クロマト）</div>
<div><b>沈殿剤</b>を加えて沈殿させる</div>
<div>ろ過・洗浄 → 乾燥・強熱して安定な<b>ひょう量形</b>にする</div>
<div>ひょう量 → 化学量論で計算</div>
</div>
<h3>代表的な組み合わせ</h3>
<div class="tblwrap"><table class="tbl">
<tr><th>目的</th><th>沈殿剤</th><th>ひょう量形</th><th>換算係数</th></tr>
<tr><td>Ag</td><td>HCl</td><td>AgCl</td><td>0.7526</td></tr>
<tr><td>Ba</td><td>H₂SO₄</td><td>BaSO₄</td><td>0.5884</td></tr>
<tr><td>SO₄²⁻</td><td>BaCl₂</td><td>BaSO₄</td><td>0.4116</td></tr>
<tr><td>Fe</td><td>NH₃</td><td>Fe₂O₃</td><td>0.6994</td></tr>
<tr><td>Al</td><td>NH₃</td><td>Al₂O₃</td><td>0.5293</td></tr>
<tr><td>Ca</td><td>(NH₄)₂C₂O₄</td><td>CaO</td><td>0.7147</td></tr>
<tr><td>Mg</td><td>(NH₄)₂HPO₄</td><td>Mg₂P₂O₇</td><td>0.2184</td></tr>
<tr><td>Ni</td><td>ジメチルグリオキシム</td><td>Ni(DMG)₂</td><td>0.2032</td></tr>
</table></div>
<p><b>換算係数</b> = 目的成分の式量 × 個数 ÷ ひょう量形の式量。たとえば Fe₂O₃ には Fe が2個あるので 2Fe/Fe₂O₃ = 2×55.85/159.69 = 0.6994。</p>
<div class="formula">目的成分の質量 = ひょう量形の質量 × 換算係数</div>
<h3>沈殿以外の分け方</h3>
<ul>
<li><b>電気分解法</b>：Cu²⁺ を白金電極に金属として析出させて量る</li>
<li><b>揮発（吸収）法</b>：加熱して出た水などを吸収剤に吸わせて量る（結晶水の定量）</li>
</ul>
<p class="slide">対応スライド：「重量分析」〜「重量分析で用いられる沈殿」</p>`},

{t:'容量分析と標準溶液',html:`
<h2>容量分析（滴定）：体積で量る</h2>
<p class="lead">濃度が分かっている溶液（<b>標準溶液</b>）を少しずつ加え、反応が終わるまでに使った<b>体積</b>から量を求める。</p>
<h3>滴定は4種類（このあとの授業で1つずつ扱う）</h3>
<ul><li>中和滴定（10/20）</li><li>キレート滴定（10/23）</li><li>酸化還元滴定（10/27）</li><li>沈殿滴定（10/30）</li></ul>
<h3>標準溶液の作り方</h3>
<p>NaOH は表面が空気中の CO₂ で炭酸塩になり、水も吸う（潮解性）ので、量っただけでは正確な濃度にならない。そこで</p>
<div class="flow">
<div>純度の高い<b>標準試薬</b>（JIS）を量って溶かす → <b>一次標準溶液</b></div>
<div>一次標準溶液で、使いたい溶液の濃度を決める（<b>標定</b>）</div>
<div>濃度が決まった溶液 → <b>二次標準溶液</b></div>
</div>
<div class="tblwrap"><table class="tbl">
<tr><th>滴定</th><th>標準試薬の例</th></tr>
<tr><td>中和</td><td>炭酸ナトリウム、フタル酸水素カリウム（NaOH の標定）</td></tr>
<tr><td>キレート</td><td>亜鉛</td></tr>
<tr><td>酸化還元</td><td>シュウ酸ナトリウム（KMnO₄ の標定）、二クロム酸カリウム、ヨウ素酸カリウム</td></tr>
<tr><td>沈殿</td><td>塩化ナトリウム（AgNO₃ の標定）</td></tr>
</table></div>
<p>標準試薬の条件（10/6 の Q&A）：<b>高純度・安定・吸湿しにくい・組成が明確・式量が大きい</b>。式量が大きいと、同じ物質量でも重く量れるので、ひょう量の相対誤差が小さくなる。</p>
<h3>ガラス器具の許容差（100 mL）</h3>
<p>ビュレット・全量ピペット・メスフラスコは ±0.10 mL、<b>メスシリンダーは ±0.6 mL</b> と大きい。正確に量りたいときにメスシリンダーは使わない。</p>
<p class="slide">対応スライド：「容量分析」〜「ガラス器具の許容誤差」</p>`},

{t:'正確さと誤差',html:`
<h2>正確さ・精度・2種類の誤差</h2>
<div class="duo">
<div><strong>正確さ</strong><span>真の値にどれだけ近いか</span></div>
<div><strong>精度</strong><span>くり返したとき、どれだけそろうか（再現性）</span></div>
</div>
<p>射撃のまとで考えると、弾が<b>中心近く</b>に当たれば正確、<b>1か所に固まって</b>いれば精度が高い。精度が高いことは正確さに必要だが、<b>精度が高くても正確とは限らない</b>（固まっていても中心からずれていることがある）。</p>
<h3>確定誤差（系統誤差）</h3>
<p>原因を特定でき、<b>補正できる</b>誤差。いつも同じ向きにずれる。</p>
<div class="defs">
<div><span class="k">機器</span><span>欠陥のある装置、未補正のはかり・ガラス器具</span></div>
<div><span class="k">操作</span><span>溶液の移し替えなど、実験操作で起こる</span></div>
<div><span class="k">方法</span><span>試薬中の不純物、不純物の共沈、副反応など、方法そのもの</span></div>
</div>
<p>例：ガラス器具の容積は温度で変わるが、<b>温度が分かれば補正できる</b>。</p>
<h3>不確定誤差（偶然誤差）</h3>
<p>原因が分かっても<b>補正できない</b>誤差。測定値はランダムにばらつき、たくさん測ると<b>正規（ガウス）分布</b>になる。</p>
<div class="formula">±1σ に 68%　±2σ に 95%　±3σ に 99.7%</div>
<h3>絶対誤差と相対誤差</h3>
<div class="formula">絶対誤差 = 測定値 − 真値（符号も含める）<small>真値 2.62 g、測定値 2.52 g → 2.52 − 2.62 = −0.10 g</small></div>
<div class="formula">相対誤差 = 絶対誤差 ÷ 真値 × 100<small>−0.10/2.62 × 100 = −3.8%</small></div>
<h3>真の値を知るのは難しい：1 kg の定義</h3>
<p>水 1 L（18世紀末）→ <b>国際キログラム原器</b>（1889年、白金イリジウム）→ 2007年に原器が約 50 μg 軽くなっていたと分かる → 2011年に廃止を決定 → <b>2019年からプランク定数で定義</b>（²⁸Si の球を使う XRCD 法など）。</p>
<p class="slide">対応スライド：「正確さと精度」〜「正確さ（真の値）を知るのは簡単ではない」</p>`},

{t:'有効数字',html:`
<h2>有効数字：最後の桁は ±1 あやしい</h2>
<p class="lead">有効数字は、測定の精度に合わせて書く桁数。<b>最後の桁に ±1 の不確かさ</b>があることを表す。</p>
<div class="tblwrap"><table class="tbl">
<tr><th>書き方</th><th>有効数字</th></tr>
<tr><td>92067 μm ／ 92.067 mm ／ 0.092067 m</td><td>どれも 5 桁（頭の 0 は数えない）</td></tr>
<tr><td>0.092000 m</td><td>5 桁（末尾の 0 は数える）</td></tr>
<tr><td>92000 μm</td><td>分からない</td></tr>
<tr><td>9.20 × 10⁴ μm</td><td>3 桁</td></tr>
</table></div>
<h3>① 掛け算・割り算：相対的な不確かさで決まる</h3>
<p>結果は<b>有効数字がいちばん少ない数</b>に合わせる。</p>
<div class="formula">35.63 × 0.548 × 0.05300 / 1.1689 = 0.885<small>0.548（3桁）に合わせて 3 桁</small></div>
<p>結果の不確かさを決めている数を<b>キーナンバー</b>という。桁数が同じなら<b>相対的に不確かなほう</b>がキーナンバー。</p>
<ul>
<li>100.0 と 0.4570 → <b>100.0</b>（1/1000 は 1/4570 より大きい）</li>
<li>0.0067 と 0.10 → <b>0.10</b>（1/10 は 1/67 より大きい）</li>
</ul>
<h3>② 足し算・引き算：小数点の位置で決まる</h3>
<p>結果は<b>小数点以下の桁がいちばん少ない数</b>に合わせる。</p>
<div class="formula">Ag₂MoO₄ = 2×107.870 + 95.94 + 4×15.9994 = 375.6776 → 375.68<small>Mo の 95.94（小数第2位まで）に合わせる</small></div>
<h3>③ 混ざっているとき</h3>
<p>項ごとに処理するのがルール。ただし途中では余分な桁を残して計算し、<b>最後に一度だけ丸める</b>。</p>
<div class="formula">(97.7/32.42 × 100.0 + 36.04)/687 = 0.491</div>
<h3>④ 対数：仮数の桁を数える</h3>
<p>log の結果の<b>小数点以下（仮数）の桁数</b> = 元の数の有効数字。整数部（指標）は桁を表すだけなので数えない。</p>
<div class="formula">log(2.0) = 0.30　　log(2.0×10⁻³) = 0.30 − 3 = −2.70</div>
<p>逆に、仮数が 0.072 なら 3 桁なので、真数は 10^0.072 = 1.18。</p>
<p class="slide">対応スライド：「有効数字」「キーナンバー」</p>`},

{t:'標準偏差',html:`
<h2>標準偏差：ばらつきを数字にする</h2>
<div class="formula">σ = √[Σ(xᵢ − μ)² / N]<small>無限回測ったときの標準偏差（μ は真の平均）</small></div>
<div class="formula">s = √[Σ(xᵢ − x̄)² / (N − 1)]<small>有限回の測定から推定する標準偏差。平均 x̄ を計算するのに自由度を 1 つ使うので N − 1 で割る</small></div>
<h3>関連する指標</h3>
<div class="defs">
<div><span class="k">s_mean</span><span><b>平均値の標準偏差（標準誤差）</b> = s/√N。N 回測った平均のばらつき。測定回数を4倍にすると半分になる</span></div>
<div><span class="k">s_rsd</span><span><b>相対標準偏差</b> = s/x̄</span></div>
<div><span class="k">CV</span><span><b>変動係数</b> = s/x̄ × 100（%）</span></div>
</div>
<h3>例題</h3>
<p>15.67、15.69、16.03 を測った。</p>
<ul>
<li>x̄ = 15.80</li>
<li>偏差の2乗：0.0169、0.0121、0.0529 → 和 0.0819</li>
<li>s = √(0.0819/2) = <b>0.20</b></li>
<li>s_mean = 0.20/√3 = <b>0.12</b></li>
<li>s_rsd = 0.20/15.80 = <b>0.013</b>、CV = <b>1.3%</b></li>
</ul>
<div class="note">マイクロピペットでは、量る体積が小さいほど CV が大きい（例：0.2 μL で 10%、1000 μL で 0.2%）。少ない量ほど相対的にばらつく。</div>
<p class="slide">対応スライド：「標準偏差」「平均値標準偏差、相対標準偏差、変動係数」</p>`}
],

{t:'桁と不確かさ',html:`
<h2>結果は「値 ± 不確かさ」で書く</h2>
<p class="lead">有効数字は「最後の桁が ±1 あやしい」という大ざっぱな表し方。<b>標準偏差</b>が分かれば、それをもっと正確に書ける。</p>
<h3>標準偏差で桁が決まる</h3>
<ul>
<li>29.02 ± 0.02 → 最後の桁に ±2 の不確かさ</li>
<li>s が大きいなら桁を減らす：<b>29.0 ± 0.2</b></li>
<li>s が小さいなら桁を増やす：<b>29.020 ± 0.002</b></li>
</ul>
<div class="note">不確かさはふつう 1 桁（先頭が 1 や 2 なら 2 桁でもよい）で書き、<b>値の桁を不確かさの桁にそろえる</b>。途中の計算は 2〜3 桁多めに残し、最後に1回だけ丸める。</div>
<h3>授業の問題</h3>
<div class="formula">log 42.0 = 1.623　　log 4.20 = 0.623<small>元の数が 3 桁 → 仮数（小数部分）を 3 桁</small></div>
<div class="formula">165.352 + 56.32 + 4.6658 − 12.8452 = 213.49<small>小数第2位までしかない 56.32 に合わせる</small></div>
<div class="formula">[(23.568/11.5) × 50.00 + 76.03] / 592 = 0.302<small>途中は 102.4696…、178.4996… と多めに残し、最後に 3 桁へ</small></div>
<h3>4回測った重さの問題</h3>

<li>標準偏差で書くと <b>29.6 ± 0.7 mg</b></li>

{t:'誤差の伝播',html:`
<h2>誤差の伝播：計算すると不確かさも伝わる</h2>
<h3>足し算・引き算：標準偏差を2乗して足す</h3>
<div class="formula">s_d = √(s_a² + s_b² + s_c²)<small>引き算でも＋で足す。s² は分散（variance）</small></div>
<p>例：(65.56 ± 0.07) + (16.13 ± 0.01) − (23.18 ± 0.02) = 58.51 ± ?</p>
<div class="formula">s_d = √(0.07² + 0.01² + 0.02²) = 0.07 → 58.51 ± 0.07</div>
<h3>掛け算・割り算：相対標準偏差を2乗して足す</h3>
<div class="formula">a = bc/d のとき　s_a,rsd = √(s_b,rsd² + s_c,rsd² + s_d,rsd²)</div>
<p>例：(13.67 ± 0.02)(120.4 ± 0.2)/(4.623 ± 0.006) = 356.0 ± ?</p>
<ul>
<li>相対標準偏差：0.0015、0.0017、0.0013</li>
<li>合成：√(0.0015² + 0.0017² + 0.0013²) = 2.6 × 10⁻³</li>
<li>356.0 × 2.6 × 10⁻³ = 0.93 → <b>356.0 ± 0.9</b></li>
</ul>
<div class="note">2乗して足すのは、<b>独立な誤差どうしは分散が足し算になる</b>から。誤差が打ち消し合うこともあるので、単純に足すより小さくなる。</div>
<h3>キーナンバーより標準偏差が優先</h3>
<p>標準偏差が分かっているときは、<b>桁数が少ない数が不確かさを支配するとは限らない</b>。</p>
<ul>
<li>(73.1 ± 0.2)(2.245 ± 0.008) = 164.1 ± 0.7　相対：0.0027 と <b>0.0036</b> → 2.245 のほうが効いている</li>
<li>(73.1 ± 0.9)(2.245 ± 0.008) = 164 ± 2　相対：<b>0.012</b> と 0.0036</li>
</ul>
<h3>授業の問題</h3>
<p>(12.18 ± 0.08)(23.04 ± 0.07)/(3.247 ± 0.006)</p>
<ul>
<li>相対：0.006568、0.003038、0.001848 → 合成 0.007469</li>
<li>値 86.4266 × 0.007469 = ±0.6455</li>
<li>答え <b>86.4 ± 0.6</b>。86.43 ± 0.65 を丸めて 86.4 ± 0.7 にするのは<b>二重丸めでダメ</b></li>
</ul>
<p class="slide">対応スライド：「誤差の伝播」「誤差の伝播と有効数字」</p>`},

{t:'信頼区間と検定',html:`
<h2>信頼区間・F 検定・t 検定</h2>
<h3>信頼区間：真の平均がありそうな範囲</h3>
<div class="formula">μ = x̄ ± t·s/√N<small>t は自由度 ν = N − 1 と信頼水準で決まる（95%：ν=2 で 4.303、ν=9 で 2.262、∞ で 1.960）</small></div>
<p>例：93.50、93.58、93.43 → x̄ = 93.50、s = 0.075 → 93.50 ± 4.303 × 0.075/√3 = <b>93.50 ± 0.19</b>（95%）</p>
<div class="note">95% 信頼区間の意味：同じ実験を何度もくり返して区間を作ると、そのうち 95% の区間が真の値を含む。</div>
<h3>F 検定：ばらつき（分散）に差があるか</h3>
<div class="formula">F = s₁² / s₂²<small>大きいほうの分散を分子に。自由度 ν₁ = N₁ − 1、ν₂ = N₂ − 1</small></div>
<p>例：s₁² = 8.3（N₁ = 7）、s₂² = 4.8（N₂ = 6）→ F = 1.7。表の値 4.95 より小さいので<b>有意差なし</b>。</p>
<h3>t 検定：平均値に差があるか</h3>
<div class="formula">t = (x̄₁ − x̄₂)/s_p × √(N₁N₂/(N₁ + N₂))<small>s_p = √{[Σ(xᵢ₁ − x̄₁)² + Σ(xᵢ₂ − x̄₂)²]/(N₁ + N₂ − 2)}、自由度 N₁ + N₂ − 2</small></div>
<ol>
<li>まず <b>F 検定</b>で2組の精度（分散）に差がないことを確かめる</li>
<li>差がなければ、2組をまとめた標準偏差 s_p で t を計算</li>
<li>計算した t が表の値より<b>大きければ有意差あり</b></li>
</ol>
<p>例：x̄₁ = 19.65、x̄₂ = 19.24 → F = 4.31 < 6.26 で精度は同等、s_p = 0.546、t = 1.2 < 2.262 → <b>有意差なし</b>。</p>
<div class="note">表の値の意味：「本当は差がない」としたとき、偶然ではこれ以上大きな値が出にくい境目。分散に差があるときは Welch の t 検定、3群以上なら分散分析（ANOVA）。</div>
<h3>実例：脳トレの論文</h3>
<p>Nature（2010）の脳トレ研究では、訓練した課題の成績は上がったが、ほかの能力への効果（転移）は 99% 水準で有意差なしだった。</p>
<p class="slide">対応スライド：「信頼区間」「F検定」「t検定」</p>`},

{t:'検量線と検出限界',html:`
<h2>最小二乗法で検量線をひく</h2>
<p class="lead">濃度 x が分かっている標準液を測って応答 y を得て、<b>y = mx + b</b> の直線を決める。直線と点の y 方向のずれの2乗の和 S を最小にする。</p>
<div class="formula">S = Σ[yᵢ − (mxᵢ + b)]²　→　∂S/∂m = 0、∂S/∂b = 0</div>
<div class="formula">m = [Σxᵢyᵢ − ΣxᵢΣyᵢ/n] / [Σxᵢ² − (Σxᵢ)²/n]　　b = ȳ − m x̄</div>
<div class="note">y 方向のずれを使うのは、標準液の濃度 x は正確に決まっていて、<b>ばらつくのは測る応答 y のほう</b>と考えるから。</div>
<h3>例：リボフラビンの蛍光</h3>
<p>Σx = 1.500、Σy = 83.6、Σx² = 0.850、Σxy = 46.58、n = 5</p>
<ul>
<li>m = (46.58 − 1.500×83.6/5)/(0.850 − 1.500²/5) = 21.5/0.400 = <b>53.8</b></li>
<li>b = 83.6/5 − 53.75 × 0.300 = <b>0.6</b></li>
<li>試料の y = 15.4 なら x = (15.4 − 0.6)/53.8 = <b>0.275 μg/mL</b></li>
</ul>
<h3>直線の不確かさ</h3>
<div class="defs">
<div><span class="k">s_y</span><span>√{Σ[yᵢ − (mxᵢ + b)]²/(n − 2)}。m と b の2つを決めたので自由度は n − 2</span></div>
<div><span class="k">s_m</span><span>傾きの標準偏差 = √[s_y²/Σ(xᵢ − x̄)²]</span></div>
<div><span class="k">s_b</span><span>切片の標準偏差</span></div>
</div>
<p>例では s_y = 0.64、s_m = ±1.0、s_b = ±0.4 → 濃度は <b>0.28 ± 0.01 μg/mL</b>。</p>
<h3>検出限界</h3>
<p>ブランク（切片）より<b>3 × 標準偏差</b>だけ大きい信号なら「本物」とみなす。</p>
<div class="formula">y = b + 3s_b に対応する濃度 → x = 3s_b/m</div>
<div class="note">「3」の意味：正規分布なら、背景が平均 + 3SD を超えることはまれ（約0.1%）。偽陽性を抑えるための目安。</div>
<p class="slide">対応スライド：「最小二乗法」〜「検出限界」</p>`},

{t:'Q&Aのまとめ',html:`
<h2>質問コーナーで出た大事なこと</h2>
<h3>正確さと精度の確かめ方</h3>
<ul>
<li><b>精度</b>：同じ測定をくり返せば分かる</li>
<li><b>正確さ</b>：標準物質を測る、空試験（ブランク）、添加回収実験、別の方法と比べる、ほかの研究室と比べる</li>
</ul>
<h3>誤差の扱い</h3>
<ul>
<li>確定誤差は一定方向のずれなので<b>補正できる</b>。操作ミスは再実験</li>
<li>乾燥しても水が残る：いつも残る分は確定誤差、残り方のばらつきは不確定誤差</li>
<li>外れ値は理由があれば除外。統計的には <b>Q 検定</b></li>
<li>摂氏温度には相対標準偏差を使わない（0 °C が本当の 0 ではないので、K で考える）</li>
</ul>
<h3>どれを書けばいい？</h3>
<div class="defs">
<div><span class="k">s</span><span>個々の測定値のばらつき</span></div>
<div><span class="k">s/√N</span><span>平均値の不確かさ（標準誤差）</span></div>
<div><span class="k">区間</span><span>真の平均がありそうな範囲（信頼区間）</span></div>
</div>
<h3>データの種類と分布</h3>
<p>数を数えるデータ（カウント）は<b>ポアソン分布</b>、割合は<b>二項分布</b>、濃度は対数正規分布になりやすい。</p>
<h3>単位の定義</h3>
<p>kg はプランク定数（キッブルバランス、シリコン球の XRCD 法）、秒は Cs-133、メートルは光速で定義されている。</p>
<p class="slide">対応スライド：10/9・10/13 冒頭の「質問お答えコーナー」</p>`}

L({id:'1009',date:'10/9',title:'生化学分析・免疫分析',short:'免疫分析',
ch:[
{t:'結合の強さ',html:`
<h2>「くっつきやすさ」を数字で表す</h2>
<p class="lead">免疫分析は、抗体が目的の分子（抗原）に<b>特異的にくっつく</b>ことを使う。まずはくっつく強さの表し方から。</p>
<div class="formula">A + B ⇄ AB　（結合の速度定数 k₁、解離の速度定数 k₋₁）</div>
<div class="defs">
<div><span class="k">Ka</span><span><b>結合定数</b> = [AB]/[A][B] = k₁/k₋₁（単位 M⁻¹）。大きいほど強くくっつく</span></div>
<div><span class="k">Kd</span><span><b>解離定数</b> = [A][B]/[AB] = k₋₁/k₁（単位 M）。<b>小さいほど</b>強くくっつく。生化学ではこちらをよく使う</span></div>
</div>
<p>Kd = 1/Ka。Kd は「半分の分子がくっついている状態の濃度」とイメージするとよい。</p>
<h3>生体分子はとても強くくっつく</h3>
<div class="tblwrap"><table class="tbl">
<tr><th>組み合わせ</th><th>Kd の目安</th></tr>
<tr><td>抗体 − タンパク質抗原</td><td>nM（10⁻⁹ M）</td></tr>
<tr><td>ストレプトアビジン − ビオチン</td><td>fM（10⁻¹⁵ M）</td></tr>
<tr><td>α-シクロデキストリン − p-ヒドロキシ安息香酸（人工分子）</td><td>mM（10⁻³ M）</td></tr>
</table></div>
<p>くっつく力は<b>分子間力・静電的相互作用・疎水性相互作用</b>（水素結合なども含む非共有結合）。1つ1つは弱いが、<b>接触面積が大きく</b>たくさん集まるので強くなる（抗体の例では接触面積 785 Å²、log Ka 8.9）。</p>
<div class="note">単位の接頭辞は 10³ ごと：ミリ m（10⁻³）→ マイクロ μ（10⁻⁶）→ ナノ n（10⁻⁹）→ ピコ p（10⁻¹²）→ フェムト f（10⁻¹⁵）→ アト a（10⁻¹⁸）→ ゼプト z（10⁻²¹）。</div>
<p class="slide">対応スライド：「結合定数と解離定数」〜「生体分子間の相互作用」</p>`},

{t:'抗体',html:`
<h2>抗体：どんな形にもくっつける道具</h2>
<p class="lead">抗体（IgG）は Y 字型のタンパク質。<b>L鎖とH鎖それぞれ3か所の超可変領域</b>（ループ構造）が集まって、抗原と結合する部分をつくる。</p>
<p>結合部位の形は、<b>くぼみ・溝・平面</b>など相手に合わせていろいろ。</p>
<h3>なぜ 10¹² 種類もの抗体が作れるのか</h3>
<ol>
<li>遺伝子の <b>V 断片と J 断片</b>（H鎖では <b>D 断片</b>も）を無作為に選んでつなぐ<br>→ L鎖 316 通り × H鎖 8262 通り ≈ 260万通り</li>
<li>つなぐときにヌクレオチドが欠けたり入ったりする</li>
<li>複製のときに変異が入る</li>
</ol>
<div class="note">抗体と酵素はどちらも「形・電荷・疎水性が相補的」なことで相手を選ぶ。ちがいは、酵素は基質をくっつけたあと<b>反応させる</b>のに対し、抗体は主に<b>くっついて見分けるだけ</b>なこと。</div>
<p class="slide">対応スライド：「抗体の構造」「抗体の多様性」</p>`},

{t:'イムノクロマト・ELISA',html:`
<h2>抗体で挟んで見つける</h2>
<h3>イムノクロマト（妊娠検査薬・インフルエンザ検査）</h3>
<div class="flow">
<div>試料をたらす。<b>金コロイド（約60 nm）で標識した1次抗体</b>が抗原にくっつく</div>
<div>ニトロセルロース膜をしみて流れる</div>
<div><b>判定部</b>：固定した2次抗体が、1次抗体とは別の場所で抗原をつかむ → 抗体‐抗原‐抗体の<b>サンドイッチ</b>で赤い線</div>
<div><b>リファレンス部</b>：固定した抗体が1次抗体そのものをつかむ → 液がちゃんと流れた確認（コントロール）</div>
</div>
<p>インフルエンザなら 0.1 nM を 10 分で検出。金コロイドは色が濃く、抗体をつけやすく、安定で、装置なしで目で見られる。</p>
<div class="note">コントロールの線は「標識抗体が流れた」ことの確認で、<b>検体を十分に採れたかまでは保証しない</b>。</div>
<h3>ELISA（酵素免疫測定法）</h3>
<p>プレートに固定した1次抗体 − 抗原 − <b>酵素で標識した2次抗体</b>の3者複合体を作り、洗ったあと基質を入れる。酵素が基質をどんどん蛍光色素に変えるので、<b>信号が増幅される</b>。</p>
<p>例：PSA（前立腺がんのマーカー）を β-ガラクトシダーゼ標識2次抗体と基質 FDG で測る → 検出限界 9 pM。</p>
<div class="duo">
<div><strong>利点</strong><span>抗体があればどんなマーカーでも</span><span>同じ操作で測れる</span><span>確立されていて簡便</span></div>
<div><strong>欠点</strong><span>感度は 1〜10 pM 程度</span><span>ウイルス感染初期（10〜100 aM）には足りない</span></div>
</div>
<p>1次抗体に直接酵素をつけないのは、1次抗体は抗原がなくても固定されているので、それでは<b>抗原の有無を区別できない</b>から。</p>
<h3>High-dose hook effect</h3>
<p>抗原が<b>多すぎる</b>と、1次抗体と2次抗体がそれぞれ別の抗原にくっついてしまい、サンドイッチができない。2次抗体は洗い流されるので<b>信号が下がり、濃度を低く見積もってしまう</b>。</p>
<p>見分け方：試料を<b>段階希釈</b>して測る。ふつうは薄めると信号が下がるが、フック効果があると<b>薄めたほうが信号が上がる</b>。イムノクロマトでも起こりうる。</p>
<p class="slide">対応スライド：「イムノクロマトグラフィー」〜「High-dose hook effect」</p>`},

{t:'デジタルELISA',html:`
<h2>デジタル ELISA：1分子を数える</h2>
<p class="lead">ELISA の感度の壁は、酵素が作った蛍光分子が<b>大きな体積に薄まってしまう</b>こと。そこで、反応の場を<b>フェムトリットル（fL = 10⁻¹⁵ L）</b>まで小さくする。</p>
<h3>授業の計算問題</h3>
<p>1秒に10回反応する酵素1分子で、生成物を 1 μM にするには？</p>
<div class="formula">1 mL：1×10⁻⁶ mol/L × 1×10⁻³ L × 6×10²³ = 6×10¹⁴ 個 → 6×10¹³ 秒 ≈ 190万年</div>
<div class="formula">1 fL：1×10⁻⁶ × 1×10⁻¹⁵ × 6×10²³ = 600 個 → 60 秒</div>
<p>μL と fL は<b>10億倍</b>ちがう（東京ドームと 1 L のペットボトルくらい）。</p>
<h3>しくみ</h3>
<ul>
<li>抗体をつけたビーズで抗原をつかみ、酵素標識2次抗体でサンドイッチ → 洗う</li>
<li>ビーズを fL の小部屋（PDMS で押さえる、疎水性ポリマー CYTOP のパターン＋油で水滴を閉じ込める）に入れる</li>
<li>β-gal が FDG を蛍光物質（フルオレセイン）に変え、<b>酵素が1個でもあればその部屋が光る</b></li>
<li>光った部屋を <b>0/1 で数える</b>（デジタル）。光る水滴の割合(%) = 光る水滴の数 / ビーズを捕まえた数 × 100</li>
</ul>
<div class="note">反応の<b>前</b>に小部屋に分けるのがポイント。反応の後で分けても、生成物はもう薄まっている。</div>
<h3>どこまで薄い濃度が測れるか</h3>
<ul>
<li>PSA の検出限界 <b>2 aM</b>（従来の ELISA の約100万倍の感度）。基準は「バックグラウンド＋3SD」</li>
<li>限界を決めているのは、<b>酵素標識2次抗体がビーズに非特異的にくっつくこと</b>（抗原 0 M でも光る部屋が出る原因）</li>
<li>理想的な結合（ストレプトアビジン‐ビオチン、Kd ≈ fM）なら <b>10 zM</b>（1 mL に約6分子）まで</li>
<li>部屋の数 N を増やすと、陽性率のばらつきが SD/√N で小さくなる（100万個で 2 aM、10万個で 13 aM、8600個で 37 aM）</li>
</ul>
<p>応用：感染のごく初期（10〜100 aM）、がん摘出後の再発、アルツハイマー（10 pM 未満）、尿や唾液での検査、新しいマーカー探し。インフルエンザのノイラミニダーゼ活性を15分で測る例もある（従来の抗原検査の1000倍）。</p>
<div class="note">検出が<b>速くなる</b>ことと検出限界が<b>下がる</b>ことは同じではない。検出限界は非特異吸着、背景のばらつき、部屋の数などにも左右される。陽性の部屋が多すぎると飽和するので、そのときは試料を薄める。</div>
<p class="slide">対応スライド：「デジタルELISA」〜「検出限界の理論値」</p>`}
],

// ===== 10/13 溶媒抽出・クロマトグラフィーの原理 =====
L({id:'1013',date:'10/13',title:'溶媒抽出・クロマトグラフィーの原理',short:'溶媒抽出・クロマト原理',
ch:[
{t:'溶媒抽出の基本',html:`
<h2>溶媒抽出：水と油で分ける</h2>
<p class="lead">混ざり合わない2つの液体（ふつうは水と有機溶媒）を<b>分液漏斗</b>でよく振り、目的の成分を片方へ移して分ける。分子は2つの相を行き来して、やがて<b>平衡</b>になる。</p>
<h3>分配比 D：どっちにどれだけ</h3>
<div class="formula">D = C_A,org / C_A<small>有機相の濃度 ÷ 水相の濃度。大きいほど有機相に抽出されやすい</small></div>
<p>同じ物質が相の中でいくつかの形（HA と A⁻ など）をとるときは、<b>それぞれの相のすべての形の濃度の和</b>で比をとる。</p>
<h3>抽出率 %E：全体の何%が有機相へ行ったか</h3>
<div class="formula">%E = 100 × C_org V_org / (C_org V_org + C V) = 100 × D / (D + V/V_org)<small>V_org：有機相の体積、V：水相の体積</small></div>
<h3>分離係数 α：2つの物質をどれだけ分けられるか</h3>
<div class="formula">α = D_A / D_B（≥ 1）<small>D の大きいほうを分子にする。α = 1 なら分けられない</small></div>
<h3>授業の問題</h3>
<p>問題1：体積が同じとき、抽出率 1% と 99% の D は？</p>
<div class="formula">1%：D = 1/99 ≈ 0.01　　99%：D = 99/1 ≈ 1×10²</div>
<p>問題2：A の抽出率 99%、B が 1% のときの α は？</p>
<div class="formula">α = 99 / (1/99) = 9801 ≈ 1×10⁴</div>
<div class="note">D が 10⁴ 倍ちがってようやく「ほぼ全部抽出」と「ほぼ残る」に分かれる。きれいに分けるのは意外と大変。</div>
<p class="slide">対応スライド：「溶媒抽出」〜「問題2」</p>`},

{t:'pHと抽出',html:`
<h2>分配定数 KD と pH の効き方</h2>
<p class="lead">分配比 D は全部の形をまとめた比。一方、<b>分配定数 KD</b> は<b>同じ化学種どうし</b>の分配平衡の定数。</p>
<div class="formula">KD = [HA]_org / [HA]<small>水相で解離した A⁻ は式に入らない（弱塩基 B なら HB⁺ は入らない）</small></div>
<h3>弱酸 HA の分配比</h3>
<p>有機相に移れるのは電荷のない HA だけ。水相では HA ⇄ H⁺ + A⁻ の平衡もある。</p>
<div class="formula">D = [HA]_org / ([HA] + [A⁻]) = KD / (1 + Ka/[H⁺])</div>
<div class="duo">
<div><strong>[H⁺] ≫ Ka（酸性）</strong><span>D ≈ KD</span><span>ほとんど HA のまま → <b>有機相へ抽出されやすい</b></span></div>
<div><strong>[H⁺] ≪ Ka（塩基性）</strong><span>D ≈ [H⁺]KD/Ka</span><span>A⁻ になって<b>水相に残る</b></span></div>
</div>
<div class="formula">塩基性側：log D ≈ −pH + log KD + pKa<small>log D と pH のグラフは傾き −1 の直線。[H⁺] = Ka（pH = pKa）で HA と A⁻ が半々</small></div>
<div class="note">弱塩基（ピリジンなど）は逆。<b>酸性で HB⁺ になって水相に残り</b>、塩基性で抽出される（グラフの傾きは +1）。</div>
<p class="slide">対応スライド：「分配定数 KD」「分配比 D は水相の pH に依存する」</p>`},

{t:'金属イオンの抽出',html:`
<h2>金属イオンを有機相へ連れていく</h2>
<p class="lead">金属イオンは水分子をまとい（水和）、電荷も持っているので、そのままでは有機相に入れない。<b>抽出剤</b>で</p>
<ol><li>錯体を作って<b>配位水を外す</b>（脱水和）</li><li>金属イオンの<b>電荷を中和する</b></li></ol>
<h3>抽出剤の4分類</h3>
<div class="defs">
<div><span class="k">酸性キレート</span><span>HA（解離して A⁻）。脱水和＋電荷中和。Htta（2-テノイルトリフルオロアセトン）、8-キノリノール（オキシン）、ジエチルジチオカルバミン酸</span></div>
<div><span class="k">イオン会合</span><span>X⁻（Cl⁻、ClO₄⁻、ピクリン酸など）や C⁺（トリオクチルアミン、TOMA⁺、TPA⁺）。脱水和＋電荷中和</span></div>
<div><span class="k">中性配位子</span><span>リン酸トリブチル（TBP）、18-クラウン-6、1,10-フェナントロリン。脱水和だけ</span></div>
<div><span class="k">配位性溶媒</span><span>イソブチルメチルケトン、ジイソプロピルエーテル、酢酸ブチル、ブタノール。脱水和だけ</span></div>
</div>
<p>2種類の抽出剤を一緒に使うと抽出がよくなることがある（<b>協同効果</b>）。配位する原子でも分類できる：S,S（ジエチルジチオカルバミン酸）、N,O（オキシン）、N,N（ジメチルグリオキシム）、O,O（アセチルアセトン）、S,N（ジチゾン）。</p>
<h3>抽出定数 Kex</h3>
<div class="formula">Mⁿ⁺ + nHA_org ⇄ MAₙ,org + nH⁺</div>
<div class="formula">Kex = [MAₙ]_org [H⁺]ⁿ / ([Mⁿ⁺][HA]_orgⁿ)</div>
<div class="formula">log D = log Kex + n log[HA]_org + n pH<small>log D と pH のグラフの傾きは n（2価なら 2）。H⁺ が出てくる反応なので、pH が高いほど抽出されやすい</small></div>
<h3>pH₁/₂：半分抽出される pH</h3>
<div class="formula">pH₁/₂ = −(1/n) log Kex − log[HA]_org<small>体積が同じで抽出率 50% → D = 1 → log D = 0 とおく</small></div>
<div class="tblwrap"><table class="tbl">
<tr><th>0.1 M Htta</th><th>log Kex</th><th>pH₁/₂</th></tr>
<tr><td>Cu²⁺</td><td>−0.94</td><td>1.47</td></tr>
<tr><td>Zn²⁺</td><td>−5.69</td><td>3.85</td></tr>
<tr><td>Cd²⁺</td><td>−8.00</td><td>5.00</td></tr>
<tr><td>Ca²⁺</td><td>−9.20</td><td>5.60</td></tr>
<tr><td>Sr²⁺</td><td>−10.50</td><td>6.25</td></tr>
</table></div>
<p>Cu²⁺ だけ pH₁/₂ が離れているので、<b>Cu²⁺ とほかの金属は pH を選べば分けやすい</b>。</p>
<p class="slide">対応スライド：「抽出剤を用いた金属イオンの溶媒抽出」〜「pH1/2」</p>`},

{t:'段理論とピーク',html:`
<h2>クロマトグラフィーは「抽出のくり返し」</h2>
<p class="lead">移動相と固定相のあいだの分配（溶媒抽出）を、小さな段ごとに何度もくり返すと考える（<b>段理論</b>）。<b>各段で平衡に達している</b>と仮定する。</p>
<p>ペーパークロマト（固定相 固体・移動相 液体）も GC（固定相 液体・移動相 気体）も、見た目はちがうが原理は同じ。初期のツヴェットの実験は吸着剤を詰めたカラムだった。</p>
<h3>二項分布 → ガウス分布</h3>
<p>1回の分配で移動相にいる確率を Pm、固定相にいる確率を Ps = 1 − Pm とすると、n 回後に k 回移動相にいた確率は</p>
<div class="formula">B(n, Pm) = ₙCₖ · Pmᵏ · Psⁿ⁻ᵏ（二項分布）</div>
<ul>
<li>1回の移動確率が小さいとき → <b>ポアソン分布</b>で近似</li>
<li>平均の移動回数が十分大きいとき → <b>ガウス分布</b>で近似</li>
</ul>
<p>カラム出口（段数 N）では、各成分は保持時間を中心にしたガウス形のピークになる。ガウス分布の<b>中心 → 保持時間 tR</b>、<b>広がり σ → ピーク幅 W</b>。</p>
<h3>理論段数 N</h3>
<div class="formula">N = (保持時間)² / 分散 = (tR/σ)² = 16(tR/W)² = 5.545(tR/W₁/₂)²</div>
<div class="formula">W = 4σ（ベースライン上の幅）　W₁/₂ = √(8 ln2) σ ≈ 2.35σ（半値幅）</div>
<p class="slide">対応スライド：「クロマトグラフィーの原理（段理論）」〜「理論段数 N」</p>`},

{t:'保持と分離',html:`
<h2>保持係数・van Deemter・分離度</h2>
<h3>保持係数 k</h3>
<div class="formula">k = (tA − t₀)/t₀　⇔　tA = (1 + k)t₀<small>t₀：固定相にまったく分配されない物質（k = 0）の溶出時間</small></div>
<p>k = 固定相にいる物質量 ÷ 移動相にいる物質量 = <b>分配比 D（分配定数 KD）× 固定相の体積/移動相の体積</b>。tR そのものとちがい、カラム長や流量の影響を除いた「保持の強さ」を比べられる。</p>
<h3>van Deemter 式（速度論）</h3>
<div class="formula">H = A + B/ū + Cū<small>H：理論段高 = カラム長/理論段数、ū：移動相の平均線流速</small></div>
<div class="defs">
<div><span class="k">A</span><span><b>渦拡散（多流路拡散）</b>。粒を詰めた充填カラムで大きい</span></div>
<div><span class="k">B/ū</span><span><b>軸方向の分子拡散</b>。拡散が遅い液体クロマト（LC）では小さい</span></div>
<div><span class="k">Cū</span><span><b>移動相と固定相のあいだの物質移動</b>。拡散が遅い LC では大きい</span></div>
</div>
<div class="formula">最適流速 ū = √(B/C)　　H_min = A + 2√(BC)</div>
<p>流速によって理論段数が変わるので、いちばんよく分かれる<b>最適な流速</b>を調べる必要がある。</p>
<h3>分離係数 α と分離度 R</h3>
<div class="formula">α = kB/kA（> 1）　　R = 2(tB − tA)/(WA + WB)</div>
<p>R がおよそ 1.5 以上なら、2つのピークがベースラインまで分かれている目安。</p>
<h3>Purnell の式</h3>
<div class="formula">R = (√N/4) × ((α − 1)/α) × (kB/((kA + kB)/2 + 1))</div>
<ul>
<li>N を大きく → カラムを長くする</li>
<li>α や k を大きく → 移動相・固定相を変える</li>
</ul>
<div class="note">グラフで比べると、<b>α を変えるのがいちばん効き</b>、次に N、k はあまり効かない。</div>
<p class="slide">対応スライド：「保持係数」〜「RAB の N、α、k 依存性」</p>`},

{t:'定性と定量',html:`
<h2>クロマトグラフィーで「何が・どれだけ」</h2>
<h3>定性分析（何か）</h3>
<ul>
<li><b>保持時間（容量）を使う</b>：固定相・移動相・流速・圧力・温度・カラム長などの条件が同じなら、成分ごとに決まる</li>
<li><b>スペクトルを使う</b>：分けた成分を質量分析計や赤外分光計にかける（GC-MS など）</li>
</ul>
<h3>定量分析（どれだけ）</h3>
<p>検出器の信号が成分量に比例するように使い、ピークの<b>面積</b>を測る（ざっくり 高さ h × 半値幅 d、実際は積分）。</p>
<div class="defs">
<div><span class="k">絶対検量線</span><span>純物質で「量 vs ピーク面積」の検量線を作る。装置に入れる試料量を<b>厳密に正確にする必要があり難しい</b></span></div>
<div><span class="k">内標準法</span><span>試料とピーク位置がちがう<b>内標準物質</b>を既知量加え、面積比 Ax/As と混合比 Mx/Ms の検量線を作る。<b>試料導入量の誤差を打ち消せる</b></span></div>
<div><span class="k">追加法</span><span><b>被検成分追加法</b>。適切な内標準物質がないときに、目的成分 A そのものを既知量 ΔMA 足して、ほかの成分 B との面積比の変化から求める</span></div>
</div>
<div class="formula">X_A(%) = ΔMA / [((A₂/B₂)(B₁/A₁) − 1) M] × 100<small>M：試料の量。A₁・B₁ は足す前、A₂・B₂ は足した後の面積</small></div>
<p class="slide">対応スライド：「クロマトグラフィーによる定性分析」〜「被検成分追加法」</p>`}
],

{t:'全体像',html:`
<h2>クロマトグラフィーは「分ける」技術</h2>
<p class="lead">混ざった試料を成分ごとに<b>分けて</b>、何が・どれだけ入っているかを調べる方法。今日の授業は全部この1つの仕組みの使い回し。</p>
<h3>仕組みは1つだけ</h3>
<p>管や紙の中に、<b>流れるもの（移動相）</b>と<b>止まっているもの（固定相）</b>がある。成分は2つの間を行ったり来たりしながら進む。固定相に長くいる成分ほど遅れて出てくる。</p>
${FIG_POOL}
<h3>種類の違いは「何で流すか」</h3>
<div class="defs">
<div><span class="k">GC</span><span>移動相が<b>気体</b>。試料を蒸発させて流す（ガスクロマトグラフィー）</span></div>
<div><span class="k">HPLC</span><span>移動相が<b>液体</b>。ポンプで押し流す（高速液体クロマトグラフィー）</span></div>
<div><span class="k">TLC</span><span>板（や紙）の上を溶媒がしみ上がる（薄層クロマトグラフィー）</span></div>
</div>
<p>固定相に「どう引っかかるか」も種類がある。固体なら吸着・イオン交換・疎水性相互作用、液体なら溶けやすさ（分配係数）。</p>
<div class="note">歴史小ネタ：ロシアの植物学者ツヴェットが葉の色素を分けたのが最初。chroma（色）＋ graphos（記録）。</div>
<p class="slide">対応スライド：「歴史は古い」〜「クロマトグラフィーの分類」</p>`},

{t:'グラフの読み方',html:`
<h2>クロマトグラムの読み方と用語</h2>
<p class="lead">カラムの出口にセンサー（検出器）があって、成分が来るたびに山が出る。この山のグラフが<b>クロマトグラム</b>。</p>
${FIG_CHROM}
<h3>まずこの5つだけ</h3>
<div class="defs">
<div><span class="k">t₀</span><span>固定相に全く引っかからない成分が出てくる時間。いわば「素通りタイム」</span></div>
<div><span class="k">tR</span><span><b>保持時間</b>。成分が出てくる時間。成分ごとに違うので「何か」の手がかりになる</span></div>
<div><span class="k">k</span><span><b>保持係数</b> = (tR − t₀)/t₀。素通りの何倍ぶん寄り道したか。目安は 1〜10</span></div>
<div><span class="k">N</span><span><b>理論段数</b> = (tR/σ)² = 16(tR/W)²。山の鋭さ。大きいほど鋭くてよく分かれる</span></div>
<div><span class="k">R</span><span><b>分離度</b> = 2(tB − tA)/(WA + WB)。隣の山とどれだけ離れているか</span></div>
</div>
<ul>
<li>山の形はガウス分布になる。成分が移動相と固定相を何度も行き来するから（二項分布 → ポアソン分布 → ガウス分布と近似していく流れだけ言えればOK）</li>
<li>山の基線幅は <b>W = 4σ</b>。同じ N なら σ = tR/√N なので、遅く出る山ほど幅が広い</li>
<li><b>α = kB/kA</b>（分離係数）は2成分の保持の差。分離を良くしたいときは、まず α（固定相・移動相・pH）、次に k、最後に N を増やす。N は √N でしか効かないので、カラムを4倍にしても R は2倍</li>
</ul>
<p>カラム長 L との関係は <span class="formula" style="display:inline;padding:2px 6px">H = L/N</span>。H（理論段高）は小さいほど高性能。</p>
<h3>山が広がる3つの理由（van Deemter式）</h3>
<div class="formula">H = A + B/ū + Cū<small>ū は移動相の流速</small></div>
<ul>
<li><b>A</b>：通り道が何通りもあって到着がばらつく（粒を詰めたカラムで起きる）</li>
<li><b>B/ū</b>：前後にじわじわ拡散する。ゆっくり流すほど効く</li>
<li><b>Cū</b>：固定相との行き来が流れに追いつかない。速く流すほど効く</li>
</ul>
<div class="note">保持時間は「平衡（どっちが好きか）」で決まり、山の広がりは「速さ（行き来の遅れ）」で決まる。この区別がQ&Aでも強調されてた。</div>
<p class="slide">対応スライド：「保持係数」「充填カラムとキャピラリーカラム」（式の多くは前回の内容）</p>`},

{t:'GC',html:`
<h2>GC：試料を気体にして流す</h2>
<h3>装置の流れ</h3>
<div class="flow">
<div><b>キャリアガス</b>　ヘリウム・窒素・アルゴンなど反応しにくい気体</div>
<div><b>注入口</b>　試料を加熱して気化（450 °C くらいまで）</div>
<div><b>カラム</b>　オーブンの中の細長い管。ここで分かれる</div>
<div><b>検出器</b>　出てきた成分を感知して山を描く</div>
</div>
<h3>カラムは2種類</h3>
<div class="duo">
<div><strong>充填カラム</strong><span>管に粒を詰める</span><span>長さ 1–10 m</span><span>〜1000 段/m</span><span>一度に多く流せる</span></div>
<div><strong>キャピラリー</strong><span>中空の細い管の内壁に液体</span><span>長さ 15–100 m</span><span>数10万〜100万段</span><span>流せる量は少ない</span></div>
</div>
<p>キャピラリーは中空なので A 項がなく、細いので C 項も小さく、長いので N が大きい。河川水の分析では充填 118 ピークに対しキャピラリーは <b>490 ピーク</b>まで見分けた。</p>
<h3>固定相は「似たもの同士」</h3>
<p>無極性の<b>ジメチルポリシロキサン</b>は炭化水素向け、高極性の<b>ポリエチレングリコール（Carbowax）</b>はアルコールなど向け。固定相の液体は、シリカ表面をシリル化したうえで化学結合させて流れ出ないようにする。</p>
<h3>温度で出てくる速さが変わる</h3>
<div class="formula">ln k = ΔHv/RT − ln γ + C<small>ΔHv：蒸発熱（大きい＝気体になりにくい）／γ：活量係数（小さい＝固定相と仲良し）</small></div>
<ul>
<li>気体になりにくい・固定相と仲良し → <b>遅く出る</b></li>
<li>温度を上げる → <b>早く出る</b></li>
<li>炭素数が増える → 遅く出る（ln をとるとほぼ直線）</li>
</ul>
<p><b>昇温法</b>：温度一定だと後ろの成分ほど遅く広がるので、測りながら温度を上げて全部をシャープに出す。</p>
<h3>保持指標：出てくる位置の「住所」</h3>
<p>直鎖アルカンを物差しにして、n-ヘプタン = 700、n-オクタン = 800 のように番号をふる。その間に出たら 7xx。どの装置で測っても比べやすいので、<b>成分の同定</b>に使う。計算は最後の章で。</p>
<p class="slide">対応スライド：「ガスクロマトグラフィー、GC」〜「昇温法」</p>`},

{t:'GCの検出器',html:`
<h2>GCの検出器：出口のセンサー</h2>
<p class="lead">「何が来たら反応するか」がそれぞれ違う。試料に合わせて選ぶ。</p>
<div class="defs">
<div><span class="k">TCD</span><span><b>熱伝導度検出器</b>。ガスの熱の伝わりやすさの変化を電気抵抗で見る。何でも測れるが感度は低い。試料を壊さない</span></div>
<div><span class="k">FID</span><span><b>水素炎イオン化</b>。炎で燃やして出るイオンの電流を測る。<b>有機物</b>に強い定番</span></div>
<div><span class="k">ECD</span><span><b>電子捕獲</b>。⁶³Ni の β 線で作った電子の流れが減るのを見る。<b>ハロゲン</b>に超高感度</span></div>
<div><span class="k">FPD</span><span><b>炎光光度</b>。水素炎の中で光る<b>硫黄・リン</b>を見る</span></div>
<div><span class="k">NPD</span><span>熱イオン化（TID）。<b>窒素・リン</b>に高感度</span></div>
<div><span class="k">MS</span><span><b>質量分析計</b>。分子の重さ（m/z）まで分かるので、何なのか特定できる</span></div>
</div>
<h3>MSの2タイプ</h3>
<div class="duo">
<div><strong>四重極</strong><span>直流＋高周波の電場が「ふるい」になって、特定の m/z だけ通す</span></div>
<div><strong>TOF（飛行時間）</strong><span>同じ電圧で加速すると軽いほど速い。v = √(2Vq/m)</span></div>
</div>
<h3>濃度型と質量型</h3>
<p><b>濃度型（C）</b>：TCD・ECD。検出器の中の濃度に反応し、試料を壊さないものが多い。<br><b>質量型（M）</b>：FID・FPD・NPD・MS。入ってきた量に反応し、壊すものが多い。</p>
<div class="note">覚え方：名前に「炎」が入る FID と FPD は燃やすから壊す、つまり質量型。</div>
<p class="slide">対応スライド：「GCに用いられる検出器」4枚</p>`},

{t:'HPLC',html:`
<h2>HPLC：液体で押し流す</h2>
<p class="lead">移動相が液体なので、蒸発させられないもの（熱に弱い・大きい分子）も分けられる。GCとの一番の違いは、<b>移動相の種類や配合も変えられる</b>こと。</p>
<h3>4種類</h3>
<ul><li>液-液（分配）</li><li>液-固（吸着）</li><li>イオン交換（次の章）</li><li>サイズ排除（次の章）</li></ul>
<h3>順相と逆相</h3>
<p>ルールは GC と同じで<b>固定相と似ている成分ほど遅く出る</b>。</p>
<div class="duo">
<div style="--c:var(--t-lc)"><strong>順相</strong><span>固定相の極性 ＞ 移動相</span><span>固定相：アミノ基・シアノ基・ジオール基など</span><span>→ 極性の低いものから出る</span></div>
<div><strong>逆相</strong><span>固定相の極性 ＜ 移動相</span><span>固定相：C18（オクタデシル基）が代表</span><span>移動相は水＋アセトニトリル等</span><span>→ 極性の高いものから出る</span></div>
</div>
<h3>授業の問題2はこれ</h3>
<p>トルエン（低）・アセトフェノン（中）・フェノール（高）を分けると</p>
<div class="formula">順相：トルエン → アセトフェノン → フェノール<br>逆相：フェノール → アセトフェノン → トルエン</div>
<h3>移動相の配合で調整する</h3>
<p>逆相で有機溶媒（アセトニトリル）を多くしすぎると、全部すぐ出てきて山が重なる。水を増やしたりメタノールを混ぜたりすると分かれる。測りながら配合を変える方法が<b>グラディエント法</b>。</p>
<h3>どの方法を選ぶか</h3>
<ul>
<li>分子量 ＞ 2000 → <b>サイズ排除</b></li>
<li>水に溶ける・イオン性 → <b>イオン交換</b>（弱いイオン性なら逆相も可）</li>
<li>水に溶けない・極性 → <b>順相</b></li>
<li>水に溶けない・非極性 → <b>逆相</b></li>
</ul>
<p class="slide">対応スライド：「高速液体クロマトグラフィー」〜「分離法選択の目安」</p>`},

{t:'イオン交換・SEC',html:`
<h2>イオン交換とサイズ排除</h2>
<h3>イオン交換：電気で引っかける</h3>
<p>固定相に＋か−の電荷がついていて、<b>反対の電荷のイオン</b>を引き寄せる。</p>
<div class="duo">
<div><strong>陽イオン交換</strong><span>交換基が−</span><span>強酸性：スルホン酸基 −SO₃H</span><span>弱酸性：カルボキシ基 −COOH</span></div>
<div><strong>陰イオン交換</strong><span>交換基が＋</span><span>強塩基性：第四級アンモニウム</span><span>弱塩基性：アミノ基</span></div>
</div>
<ul>
<li><b>2価は1価より強くくっつく</b>。陰イオンなら F⁻ が最初、SO₄²⁻ が最後に出る</li>
<li>イオンになっていない成分はくっつかない。弱酸なら pH ≥ pKa + 1.5 で約97%がイオン</li>
</ul>
<h3>イオンクロマトとサプレッサー</h3>
<p>溶離液（NaOH など）のイオンが多すぎて、電気伝導度で試料が見えにくい。そこで出口に<b>サプレッサー</b>を置いて溶離液を水に変えて消し、試料のイオンだけを高感度で測る。</p>
<h3>サイズ排除（SEC）：穴あきビーズのふるい</h3>
<p>固定相は穴だらけのゲルの粒。小さい分子は穴の中に入り込んで遠回りするが、大きい分子は穴に入れず素通りする。だから<b>大きい順に出る</b>。</p>
<div class="formula">問題3：300 kDa → 70 kDa → 1 kDa</div>
<p>全く穴に入れない分子は K = 0（V₀で出る）、全部入れる分子は K = 1（Veで出る）。</p>
<div class="note">電気泳動は逆。ゲルの網目を「くぐり抜ける」ので大きい DNA ほど遅い。ゲル濃度を上げると網目が細かくなってさらに遅くなる。</div>
<p class="slide">対応スライド：「イオン交換クロマトグラフィー」〜「アガロース電気泳動の例」</p>`},

{t:'HPLC検出器・TLC',html:`
<h2>HPLCの検出器とTLC</h2>
<h3>HPLCの検出器</h3>
<div class="defs">
<div><span class="k">UV</span><span><b>紫外可視吸収</b>。光をどれだけ吸うか。A = log(P₀/P) = abc（ランバート・ベール）。紫外線を吸う物質向け</span></div>
<div><span class="k">蛍光</span><span>吸った光より<b>波長の長い光</b>を出す物質向け。薄ければ F ≈ 2.3φP₀abc で濃度に比例</span></div>
<div><span class="k">RID</span><span><b>示差屈折率</b>。光の曲がり方の差（スネルの法則）。何でも測れるが温度に敏感で、グラディエント法はほぼ使えない</span></div>
<div><span class="k">電気</span><span>電気化学検出器・電導度検出器。イオンや酸化還元する物質向け</span></div>
</div>
<h3>TLC（薄層クロマトグラフィー）</h3>
<p>ガラス板にシリカゲルなどを塗り、下から溶媒を<b>毛細管現象</b>でしみ上がらせる。一定時間後に<b>どこまで進んだか</b>で分ける。</p>
<div class="formula">Rf = 成分の移動距離 / 溶媒の先端の移動距離</div>
<p>カラムは「距離を決めて時間を測る」、TLCは「時間を決めて距離を測る」。裏返しの関係なので</p>
<div class="formula">Rf = t₀/tR = 1/(1 + k)</div>
<p>見えない成分は、硫酸をかけて焦がす・発色試薬をかける・蛍光入りの板に紫外線を当てる、で見つける。</p>
<p class="slide">対応スライド：「HPLCに用いられる検出器」〜「TLCにおけるRf値」</p>`},

{t:'計算まとめ',html:`
<h2>試験に出る計算</h2>
<p class="lead">先生のQ&Aでは「丸暗記より定義と意味」「授業中の問題が自力で解ければ目安」とのこと。</p>
<div class="formula">k = (tR − t₀)/t₀</div>
<div class="formula">N = (tR/σ)² = 16(tR/W)²　　H = L/N</div>
<div class="formula">R = 2(tB − tA)/(WA + WB)</div>
<div class="formula">Rf = 1/(1 + k)</div>
<div class="formula">I = 100N + 100n × (log t′X − log t′N)/(log t′N+n − log t′N)<small>t′ = t − t₀（補正保持時間）。N は低い側のアルカンの炭素数、n は2本の炭素数の差（隣同士なら1）</small></div>
<h3>問題1を解いてみる</h3>
<p>補正保持時間：n-ヘプタン 10.0 min、試料X 15.7 min、n-オクタン 20.0 min。</p>
<ul>
<li>ヘプタンは C7 なので 100N = 700、オクタンとの差は1なので n = 1</li>
<li>log 15.7 − log 10.0 = log 1.57 = 0.196</li>
<li>log 20.0 − log 10.0 = log 2 = 0.301</li>
<li>I = 700 + 100 × 0.196/0.301 = 700 + 65.1</li>
</ul>
<div class="formula">I = 765</div>
<div class="note">直線で比例配分すると 757 になって間違い。<b>log で内挿する</b>のがポイント。</div>
<h3>被検成分追加法</h3>
<p>A を既知量 ΔMA だけ足して、別成分 B との面積比がどれだけ増えたかから元の A の量を逆算する。</p>
<div class="formula">mA = ΔMA / {(A₂/B₂)(B₁/A₁) − 1}</div>
<p>B との比を使うのは、注入量のばらつきを打ち消すため。</p>`}
],

ch:[
{t:'酸と塩基',html:`
<h2>酸と塩基の定義と解離定数</h2>
<p class="lead">中和滴定は、中和反応による<b>pH の変化</b>を使って量を決める方法。当量点（中和点）の前後で pH が大きく変わる。まず酸と塩基をきちんと定義する。</p>
<h3>2つの定義</h3>
<div class="duo">
<div><strong>Arrhenius</strong><span>酸：H⁺ を出す（HCl、HNO₃、H₂SO₄）</span><span>塩基：OH⁻ を出す（NaOH、KOH、Ca(OH)₂）</span><span>Na₂CO₃ や NH₃ が塩基性になるのを説明できない</span></div>
<div><strong>Brønsted-Lowry</strong><span>酸：H⁺ を<b>渡す</b>もの（供与体）</span><span>塩基：H⁺ を<b>受け取る</b>もの（受容体）</span><span>水の役割まで考える</span></div>
</div>
<div class="formula">HA + H₂O → H₃O⁺ + A⁻　　B + H₂O → HB⁺ + OH⁻<small>例：NH₃ + H₂O → NH₄⁺ + OH⁻。H₃O⁺ はオキソニウム（ヒドロニウム）イオン</small></div>
<p>HA と A⁻、HB⁺ と B のように H⁺ 1個だけちがう組を<b>共役酸</b>・<b>共役塩基</b>という。強酸は HClO₄、HBr、H₂SO₄、HCl。</p>
<h3>解離定数</h3>
<div class="formula">Ka = [H⁺][A⁻]/[HA]　　Kb = [HB⁺][OH⁻]/[B]<small>うすい水溶液では [H₂O] ≡ 1（正確には活量が 1）とみなして式から外す</small></div>
<p>Ka が大きい（<b>pKa = −log Ka が小さい</b>）ほど解離しやすい＝強い酸。</p>
<h3>水のイオン積</h3>
<div class="formula">Kw = [H⁺][OH⁻] = 1.0 × 10⁻¹⁴ M²（25 °C）</div>
<div class="formula">共役酸塩基対では　Ka × Kb = Kw　→　pKa + pKb = 14</div>
<p>最近は塩基の強さも<b>共役酸の pKa</b> で表すことが多い（アンモニアなら NH₄⁺ の pKa = 9.24）。</p>
<div class="tblwrap"><table class="tbl">
<tr><th>物質</th><th>pKa</th></tr>
<tr><td>酢酸</td><td>4.76</td></tr>
<tr><td>リン酸</td><td>2.15 / 7.20 / 12.35</td></tr>
<tr><td>炭酸</td><td>6.34 / 10.25</td></tr>
<tr><td>アンモニア（NH₄⁺）</td><td>9.24</td></tr>
<tr><td>フェノール</td><td>9.89</td></tr>
</table></div>
<p class="slide">対応スライド：「酸と塩基：Arrhenius の定義」〜「酸解離指数 pKa」</p>`},

{t:'pHの計算',html:`
<h2>水溶液の [H₃O⁺] を求める</h2>
<p class="lead">道具は2つだけ。<b>チャージバランス</b>（＋と−の電荷の合計は等しい）と<b>マスバランス</b>（入れた物質の総量は変わらない）。</p>
<h3>問題1：強塩基</h3>
<p>1.0 × 10⁻² M NaOH → [OH⁻] = 1.0 × 10⁻²、[H⁺] = Kw/[OH⁻] = 1.0 × 10⁻¹² → <b>pH 12.00</b></p>
<h3>強酸 HA（ほぼ全部解離）</h3>
<div class="formula">[H₃O⁺] = [A⁻] + [OH⁻] = [A⁻] + Kw/[H₃O⁺]</div>
<div class="formula">[H₃O⁺] = ([A⁻] + √([A⁻]² + 4Kw)) / 2<small>濃度は負にならないので＋の解。[A⁻] は HA の全濃度とおける</small></div>
<h3>弱酸 HA（濃度 Ca）</h3>
<p>チャージバランス [H₃O⁺] = [A⁻] + [OH⁻]、マスバランス Ca = [HA] + [A⁻] から、厳密には [H₃O⁺] の3次方程式になる。そこで近似する。</p>
<div class="defs">
<div><span class="k">近似1</span><span>溶液が酸性（[H₃O⁺] ≫ [OH⁻]、pH 6 以下が目安）<br>[H₃O⁺] = (−Ka + √(Ka² + 4KaCa)) / 2</span></div>
<div><span class="k">近似2</span><span>さらに Ca ≫ [H₃O⁺]（[H₃O⁺]/Ca ≤ 5%、ほとんど解離していない）<br><b>[H₃O⁺] = √(Ka Ca)</b></span></div>
</div>
<p>例：0.10 M 酢酸 → √(1.74×10⁻⁵ × 0.10) = 1.3×10⁻³ M → pH 2.88</p>
<h3>弱酸の塩 NaA（濃度 Cb）</h3>
<p>A⁻ + H₂O ⇄ HA + OH⁻ で<b>塩基性</b>になる。</p>
<div class="defs">
<div><span class="k">近似1</span><span>溶液が塩基性（pH 8 以上が目安）<br>[H₃O⁺] = (Kw + √(Kw² + 4KaKwCb)) / 2Cb</span></div>
<div><span class="k">近似2</span><span>さらに Cb ≫ [OH⁻]<br><b>[H₃O⁺] = √(Ka Kw / Cb)</b></span></div>
</div>
<p>例：0.050 M 酢酸ナトリウム → √(1.74×10⁻⁵ × 10⁻¹⁴ / 0.050) = 1.9×10⁻⁹ → pH 8.73（0.1 M どうしの酢酸の滴定の当量点）</p>
<p class="slide">対応スライド：「水溶液のオキソニウムイオン濃度の求め方」4枚</p>`},

{t:'緩衝液',html:`
<h2>pH 緩衝液：pH を変えにくい溶液</h2>
<p class="lead"><b>弱酸（弱塩基）とその塩</b>を混ぜると、酸や塩基を少し加えても pH がほとんど変わらない。</p>
<p>弱酸 HA（Ca）と塩 NaA（Cb）の混合液では、チャージバランス Cb + [H₃O⁺] = [A⁻] + [OH⁻]、マスバランス Ca + Cb = [HA] + [A⁻]。両方とも濃い（Ca, Cb ≫ [H₃O⁺], [OH⁻]）とすると</p>
<div class="formula">[H₃O⁺] = Ka Ca / Cb</div>
<div class="formula">pH = pKa + log(Cb/Ca)　（= pKa + log([A⁻]/[HA])）<small>ヘンダーソン・ハッセルバルヒ式。厳密には平衡濃度 [A⁻]、[HA] の式で、Ca・Cb を使うのは近似</small></div>
<h3>授業の問題</h3>
<p>問題2：0.10 M 酢酸 ＋ 0.10 M 酢酸ナトリウム（pKa 4.76）</p>
<div class="formula">pH = 4.76 + log(0.10/0.10) = 4.76</div>
<p>問題3：そこへ NaOH を 1.0 × 10⁻² M 加える。NaOH が酢酸を中和するので Ca = 0.09、Cb = 0.11</p>
<div class="formula">pH = 4.76 + log(0.11/0.09) = 4.76 + 0.09 = 4.85</div>
<div class="note">純水に同じ NaOH を入れると pH 7 → 12 に跳ね上がる。緩衝液だと 0.09 しか変わらない。</div>
<h3>リン酸：3つの pH で緩衝作用</h3>
<div class="formula">H₃PO₄ ⇄ H₂PO₄⁻（pKa₁ 2.15）⇄ HPO₄²⁻（pKa₂ 7.20）⇄ PO₄³⁻（pKa₃ 12.35）</div>
<p>それぞれの pKa と同じ pH では、共役酸と共役塩基の濃度が<b>等しく</b>なる。このとき緩衝作用がいちばんよく効く。リン酸は<b>3つの pH 領域</b>で緩衝液になる。</p>
<p class="slide">対応スライド：「pH 緩衝溶液」〜「多段階の酸解離平衡：リン酸」</p>`},

{t:'滴定曲線',html:`
<h2>滴定曲線の読み方</h2>
<h3>当量点の pH は 7 とは限らない</h3>
<div class="tblwrap"><table class="tbl">
<tr><th>組み合わせ</th><th>当量点にあるもの</th><th>当量点の pH</th></tr>
<tr><td>HCl を NaOH で</td><td>NaCl</td><td>7</td></tr>
<tr><td>酢酸を NaOH で</td><td>CH₃COONa（塩基性）</td><td>約 9</td></tr>
<tr><td>NH₃ を HCl で</td><td>NH₄Cl（酸性）</td><td>約 5</td></tr>
</table></div>
<p>弱酸の滴定では、当量点で CH₃COO⁻ + H₂O ⇄ CH₃COOH + OH⁻ が起こって塩基性になる。</p>
<h3>濃度を下げると</h3>
<p><b>pH ジャンプ（当量点での急な変化）が小さくなる</b>。酢酸の当量点の pH も 8.73（0.1 M）→ 8.23（0.01 M）→ 7.73（0.001 M）と下がる。</p>
<h3>Ka・Kb が小さいと</h3>
<p>弱い酸ほど滴定の始まりの pH が高く、当量点でのジャンプが小さい。<b>Ka（Kb）が小さい弱酸（弱塩基）の滴定は難しい</b>（Ka = 10⁻⁹ くらいだとほとんどジャンプしない）。</p>
<h3>多段階の滴定：リン酸</h3>
<ul>
<li><b>半当量点</b>の pH ≈ pKa（共役酸と共役塩基が同じ量だから）</li>
<li>第1当量点 pH₁ = (pKa₁ + pKa₂)/2 = (2.15 + 7.20)/2 ≈ 4.7</li>
<li>第2当量点 pH₂ = (pKa₂ + pKa₃)/2 = (7.20 + 12.35)/2 ≈ 9.8</li>
</ul>
<p class="slide">対応スライド：「中和滴定：中和反応による pH 変化で物質を定量」〜「多段階の中和滴定の例」</p>`},

{t:'指示薬と応用',html:`
<h2>指示薬：色で当量点を知らせる</h2>
<p class="lead">指示薬<b>自身も弱酸（または弱塩基）</b>で、HInd と Ind⁻ で色がちがう。</p>
<div class="formula">HInd（赤）+ H₂O ⇄ H₃O⁺ + Ind⁻（青）</div>
<div class="formula">pH = pKa + log([Ind⁻]/[HInd])</div>
<p>片方がもう片方の<b>10倍以上</b>あると、その色だけが見える。</p>
<ul>
<li>赤に見える：pH < pKa − 1</li>
<li>青に見える：pH > pKa + 1</li>
</ul>
<div class="note">つまり色がはっきり変わるには、<b>pKa を中心に 2 以上の pH 変化</b>が必要。指示薬の変色域が、滴定の pH ジャンプの中に収まるものを選ぶ。</div>
<div class="tblwrap"><table class="tbl">
<tr><th>指示薬</th><th>変色（酸性 → 塩基性）</th><th>変色域の目安</th></tr>
<tr><td>メチルオレンジ</td><td>赤 → 黄</td><td>pH 3〜4.5</td></tr>
<tr><td>ブロモフェノールブルー</td><td>黄 → 青</td><td>pH 3〜4.6（pKa 4.1）</td></tr>
<tr><td>メチルレッド</td><td>赤 → 黄</td><td>pH 4.4〜6.2</td></tr>
<tr><td>ブロモチモールブルー</td><td>黄 → 青</td><td>pH 6〜7.6</td></tr>
<tr><td>フェノールフタレイン</td><td>無色 → 赤紫</td><td>pH 8〜10（pKa 9.7）</td></tr>
</table></div>
<ul>
<li>強酸 − 強塩基：ジャンプが大きいので、フェノールフタレインでもブロモチモールブルーでもよい</li>
<li>酢酸（弱酸）を NaOH で：当量点が塩基性 → <b>フェノールフタレイン</b></li>
<li>NH₃（弱塩基）を HCl で：当量点が酸性 → <b>メチルレッド</b></li>
</ul>
<h3>応用：NaOH と Na₂CO₃ の分別定量</h3>
<p>固体の NaOH は空気中の CO₂ にふれて表面が Na₂CO₃ になる。Na₂CO₃ の中和は<b>2段階</b>。</p>
<div class="formula">CO₃²⁻ + H₃O⁺ → HCO₃⁻ + H₂O　　HCO₃⁻ + H₃O⁺ → CO₂ + 2H₂O</div>
<div class="flow">
<div><b>フェノールフタレイン</b>で終点まで HCl を加える → NaOH の当量点＋Na₂CO₃ の第1当量点<br>n(HCl) = n(NaOH) + n(Na₂CO₃)</div>
<div>続けて<b>メチルオレンジ</b>で終点まで → Na₂CO₃ の第2当量点<br>追加した HCl = n(HCO₃⁻) = n(Na₂CO₃)</div>
</div>
<p class="slide">対応スライド：「指示薬：pH による色の変化で当量点を検出」〜「NaOH と Na₂CO₃ の分別定量」</p>`}
],

L({subj:'muki',id:'m1006',date:'10/6',title:'第1章 原子の構造',short:'1章 原子の構造',
ch:[
{t:'原子と量子数',html:`
<h2>原子のつくりと4つの量子数</h2>
<p class="lead">原子は原子核（陽子＋中性子）と電子からできている。大きさは原子が約 10⁻¹⁰ m、原子核は約 10⁻¹⁵ m。</p>
<ul>
<li>陽子と中性子をつなぐのは<b>核力</b>（強い相互作用）</li>
<li>原子核と電子を引きつけるのは<b>クーロン力</b></li>
</ul>
<h3>水素型原子</h3>
<p><b>電子が1個だけ</b>の原子・イオン（H、He⁺、Li²⁺）。陽子はいくつでもよい。H⁻ は電子2個なので水素型ではない。シュレーディンガー方程式をきちんと解けるのは水素型まで（電子が2個以上だと多体問題になる）。</p>
<h3>量子数</h3>
<div class="defs">
<div><span class="k">n</span><span><b>主量子数</b>。軌道のエネルギーを決める。1, 2, 3, …</span></div>
<div><span class="k">l</span><span><b>方位量子数</b>。軌道の形。0 〜 n−1（0, 1, 2, 3 → s, p, d, f）</span></div>
<div><span class="k">mₗ</span><span><b>磁気量子数</b>。軌道の向き。−l 〜 +l（s は1個、p は3個、d は5個、f は7個）</span></div>
<div><span class="k">mₛ</span><span><b>スピン磁気量子数</b>。+1/2 と −1/2 の2つだけ。磁性のもと</span></div>
</div>
<p>イメージ：n・l・mₗ は電子の「公転」、mₛ は「自転」のたとえ（本当に回っているわけではない）。</p>
<h3>波動関数 ψ</h3>
<ol>
<li>時間とともに振動する</li>
<li>重ね合わせると<b>干渉</b>する → 符号（位相）が大事（結合をつくるときに効く）</li>
<li>電子の見つかる確率は |ψ|² に比例</li>
</ol>
<p class="slide">対応スライド：01_原子の構造「1.1 原子の構造」〜「量子数」</p>`},

{t:'軌道の形と節',html:`
<h2>s・p・d 軌道の形と「節」</h2>
<h3>s 軌道</h3>
<p>球対称。確率密度は原点（原子核の位置）でいちばん大きい。n が大きくなると外へ広がり、符号が反転する<b>動径節</b>が1つずつ増える（1s：0、2s：1、3s：2）。</p>
<h3>動径分布関数</h3>
<p>確率密度は原点で最大だが、「半径 r の球面のどこかに見つかる確率」r²R² は、ある半径で最大になる。1s ではその半径は <b>r_max = a₀/Z</b>。</p>
<h3>p・d・f 軌道</h3>
<p>原点を通る節面（<b>方位節</b>）で符号が分かれる。p は方位節1つ、d は2つ、f は3つ。</p>
<div class="formula">節の合計 = n − 1　方位節 = l　動径節 = n − l − 1</div>
<p>例：3p は方位節1＋動径節1 = 2。3s（動径節2）と節の合計が同じで、<b>水素型原子ではエネルギーも同じ</b>。</p>
<div class="note">形の由来：両端を固定した弦の振動（定在波）と同じ考え方。球面上の定在波（球面調和関数）×動径方向の波動関数 R で表される。</div>
<p class="slide">対応スライド：01「s軌道」〜「軌道の形の起源」</p>`},

{t:'遮蔽と貫入',html:`
<h2>多電子原子：遮蔽と貫入（試験頻出）</h2>
<p class="lead">電子が2個以上あると、ほかの電子の負電荷が原子核の正電荷を打ち消す。これを<b>遮蔽</b>という。電子が実際に感じる核電荷を<b>有効核電荷 Z_eff</b> という。</p>
<div class="duo">
<div><strong>水素型</strong><span>2s と 2p は同じエネルギー</span></div>
<div><strong>多電子原子</strong><span><b>2s < 2p</b>（2s のほうが安定）</span></div>
</div>
<h3>なぜ 2s のほうが低い？</h3>
<p>2s 軌道には原子核のすぐ近くに小さな山がある（<b>貫入</b>）。核の近くでは内側の電子に遮蔽されにくいので、強く引きつけられてエネルギーが下がる。</p>
<div class="formula">貫入の大きさ：ns > np > nd > nf</div>
<p>ns 軌道は、いちばん内側まで入り込むと同時に、いちばん外側まで広がった軌道でもある。</p>
<h3>スレーター則：Z_eff = Z − σ</h3>
<ol>
<li>注目する電子より外側の電子は無視</li>
<li>同じグループのほかの電子：1個につき <b>0.35</b>（1s どうしは 0.30）</li>
<li>主量子数が1つ小さい殻（n−1）の電子：<b>0.85</b>、それより内側：<b>1.00</b></li>
<li>d・f 電子では、内側の電子はすべて 1.00</li>
</ol>
<p>グループ分け：(1s)(2s,2p)(3s,3p)(3d)(4s,4p)(4d)(4f)(5s,5p)…</p>
<div class="formula">Mg（Z = 12）の 3s 電子：σ = 1×0.35 + 8×0.85 + 2×1.00 = 9.15<small>Z_eff = 12 − 9.15 = 2.85</small></div>
<p>同じ周期を左から右へ進むと Z_eff は<b>大きくなる</b>（同じグループの電子は 0.35 しか遮蔽しないので、核電荷の増え方が勝つ）。例：Li 1.28 → Ne 5.76。</p>
<p class="slide">対応スライド：01「遮蔽と貫入」「スレーター則」「有効核電荷」</p>`},

{t:'電子配置',html:`
<h2>電子配置のルール</h2>
<h3>パウリの排他律</h3>
<p>4つの量子数がすべて同じ電子は1個しか存在できない → <b>1つの軌道に電子は2個まで</b>（スピンは逆向き）。</p>
<h3>構成原理</h3>
<div class="formula">1s → 2s → 2p → 3s → 3p → 4s → 3d → 4p → 5s → 4d → …</div>
<p>例：C は 1s² 2s² 2p² = [He]2s² 2p²。電子が埋まるにつれて軌道のエネルギーも変わる。</p>
<h3>フントの規則</h3>
<p>エネルギーが同じ軌道（例：2p の3つ）には、<b>別々の軌道に、スピンをそろえて</b>1個ずつ入る。同じ空間に入ると電子どうしが反発するし、スピンがそろうと交換エネルギーで安定になる。</p>
<h3>半閉殻・閉殻の安定化</h3>
<p>d⁵・f⁷（半閉殻）はスピンがそろって大きく安定。d¹⁰（閉殻）も安定。</p>
<div class="tblwrap"><table class="tbl">
<tr><th>元素</th><th>電子配置</th><th>理由</th></tr>
<tr><td>Cr</td><td>[Ar]3d⁵ 4s¹</td><td>半閉殻 d⁵ が安定（3d⁴ 4s² ではない）</td></tr>
<tr><td>Cu</td><td>[Ar]3d¹⁰ 4s¹</td><td>閉殻 d¹⁰ と大きな核電荷</td></tr>
<tr><td>そのほか</td><td>4s² が先に埋まる</td><td>有効核電荷・電子間反発で 4s が有利</td></tr>
</table></div>
<div class="note">陽イオンになると、核電荷の寄与が支配的になって<b>常に 3d が 4s より安定</b>。だから Fe²⁺ は [Ar]3d⁶（4s の電子から抜ける）。</div>
<p class="slide">対応スライド：01「パウリの排他律」〜「第4周期遷移金属の電子配置」</p>`},

{t:'周期性',html:`
<h2>原子半径・イオン化エネルギー・電子親和力・電気陰性度</h2>
<h3>原子半径（試験頻出）</h3>
<ul>
<li>同じ族で<b>下へ</b> → 大きくなる（n の大きい外側の軌道を使う）</li>
<li>同じ周期で<b>右へ</b> → 小さくなる（有効核電荷が増える）</li>
<li>例外：第5周期 → 第6周期ではほとんど変わらない（<b>第6周期の収縮</b>）</li>
</ul>
<p>第6周期の収縮の理由は2つ。① <b>ランタノイド収縮</b>：4f 電子は遮蔽が弱く、最外殻の有効核電荷が大きい。② <b>相対論効果</b>：重い原子では内側の s 電子が光速の半分くらいで動き、質量が増えて s・p 軌道が縮む。</p>
<div class="note">金が金色なのも相対論効果。d 軌道が不安定化、s 軌道が安定化して、d→s の遷移が紫外線から可視光（紫）まで下がる。紫を吸収するので補色の金色に見える。銀は紫外線を吸収するので銀色。</div>
<p>原子半径の定義：金属結合半径、共有結合半径（同じ元素の分子の核間距離の半分）、イオン半径（O²⁻ = 140 pm を基準）、ファンデルワールス半径（直観的な大きさに一番近い）。</p>
<h3>イオン化エネルギー I</h3>
<div class="formula">A(g) → A⁺(g) + e⁻　I = E(A⁺) − E(A)（いつも正）</div>
<p>同じ族で下へ → 小さく、同じ周期で右へ → 大きく。例外は2つ：</p>
<ul>
<li><b>Be > B</b>：B の電子は 2s より浅い 2p に入っている</li>
<li><b>N > O</b>：O では 2p の1つの軌道に2個目の電子が入り、電子どうしの反発が大きい</li>
</ul>
<h3>電子親和力 Eₐ</h3>
<div class="formula">A(g) + e⁻ → A⁻(g)　Eₐ = E(A) − E(A⁻)</div>
<p>右上（F 付近）で大きい。値は F 328、<b>Cl 349 kJ/mol</b>（Cl のほうが大きい）。15族の N は小さい（−8）：4個目の p 電子が反発するため。</p>
<h3>電気陰性度 χ</h3>
<p>化合物の中で原子が電子を引きつける強さ。マリケンの定義は</p>
<div class="formula">χ = (I + Eₐ)/2</div>
<p>最外殻電子の有効核電荷とほぼ一致。F が約4で最大、Cs が約0.8。</p>
<h3>分極率 α</h3>
<p>電場の中での電子雲のゆがみやすさ。<b>大きくて重い原子・イオンほど大きい</b>（電子が核から遠い）。</p>
<p><b>ファヤンスの規則</b>：小さくて電荷の大きい陽イオンは相手をゆがめる力（分極能）が強い。大きくて電荷の大きい陰イオンはゆがみやすい。希ガス型でない陽イオン（特に d¹⁰）は分極能が高い。</p>
<p class="slide">対応スライド：01「原子半径」〜「ファヤンスの規則」</p>`}

ch:[
{t:'ルイス構造とVSEPR',html:`
<h2>分子の形を予想する</h2>
<h3>ルイス構造式</h3>
<p>価電子を点で書き、各原子が<b>8個（オクテット）</b>になるように結合と非共有電子対を配置する。</p>
<h3>共鳴</h3>
<p>O₃ の2つの O−O 結合は同じ長さ。2つのルイス構造を平均した<b>共鳴混成体</b>として表す（結合次数 1.5）。共鳴混成体は、どのルイス構造よりもエネルギーが低い。</p>
<h3>VSEPR（原子価殻電子対反発則）</h3>
<p>中心原子のまわりの電子対（結合も非共有電子対も）は、<b>できるだけ離れる</b>ように並ぶ。</p>
<div class="tblwrap"><table class="tbl">
<tr><th>電子対の数</th><th>配置</th><th>例</th></tr>
<tr><td>2</td><td>直線</td><td>CO₂、HCN</td></tr>
<tr><td>3</td><td>平面三角形</td><td>BF₃、SO₃、NO₃⁻、CO₃²⁻</td></tr>
<tr><td>4</td><td>四面体</td><td>CH₄、SO₄²⁻（NH₃ は三方錐、H₂O は折れ線）</td></tr>
<tr><td>5</td><td>三方両錐</td><td>PCl₅</td></tr>
<tr><td>6</td><td>八面体</td><td>SF₆（XeF₄ は平面四角形）</td></tr>
</table></div>
<p>非共有電子対も「場所」を取るので、H₂O は四面体のうち2か所が非共有電子対 → <b>折れ線</b>（104.5°）。</p>
<div class="note">VSEPR は直観的で原始的だが、まず最初に使う方法。多重結合や d 電子（遷移金属錯体）がある場合は電子間の反発以外も考える必要がある。</div>
<p class="slide">対応スライド：02「ルイス構造」〜「VSEPR」</p>`},

{t:'VB法と混成軌道',html:`
<h2>原子価結合法（VB法）</h2>
<p class="lead">各原子の軌道に1個ずつある電子が<b>対をつくって共有</b>されることで結合ができる、と考える最も古典的な方法。</p>
<div class="formula">Ψ_VB ∝ χ_A(r₁)χ_B(r₂) + χ_A(r₂)χ_B(r₁)<small>電子1が A・電子2が B の状態と、その逆の状態の重ね合わせ。どちらの電子か区別できない → 共有結合</small></div>
<h3>σ 結合と π 結合</h3>
<div class="duo">
<div><strong>σ 結合</strong><span>結合軸のまわりに円筒対称（s+s、p の頭どうし）</span><span>重なりが大きい</span></div>
<div><strong>π 結合</strong><span>結合軸を含む節面を1つ持つ（p の横どうし）</span></div>
</div>
<p>N₂：2pz どうしで σ、2px・2py どうしで π が2本 → <b>三重結合</b>。</p>
<h3>単純な VB 法の問題点</h3>
<ul>
<li>H₂O を O の 2px・2py で作ると結合角は 90° になるはず（実際は 104.5°）</li>
<li>C は 2s² 2p² で不対電子が2個 → 結合2本しか作れないはず（実際は CH₄ で4本）</li>
</ul>
<h3>混成軌道</h3>
<p>同じ原子の s と p 軌道を<b>混ぜて新しい軌道</b>を作る。VSEPR の形と電子の数から選ぶ。</p>
<div class="tblwrap"><table class="tbl">
<tr><th>混成</th><th>軌道の数</th><th>形</th><th>例</th></tr>
<tr><td>sp</td><td>2</td><td>直線 180°</td><td>BeH₂、C₂H₂</td></tr>
<tr><td>sp²</td><td>3</td><td>平面三角形 120°</td><td>BF₃、C₂H₄</td></tr>
<tr><td>sp³</td><td>4</td><td>正四面体 109.5°</td><td>CH₄</td></tr>
</table></div>
<div class="note">sp³d や sp³d² と書いても、主族元素で実際に d 軌道が大きく効いているとは限らない。</div>
<h3>VB 法と MO 法</h3>
<p>突き詰めるとどちらも同じ結果になる。VB 法は結合の起源や基本的な形の説明が得意。MO 法（次の章）は磁性や軌道のエネルギーの説明が得意。</p>
<p class="slide">対応スライド：02「VB理論」〜「混成軌道」</p>`},

{t:'分子軌道法の基本',html:`
<h2>分子軌道法（MO法）</h2>
<p class="lead">最初から<b>分子全体に広がった軌道</b>を考える。原子軌道の足し合わせで分子軌道を作る（<b>LCAO 近似</b>）。</p>
<div class="formula">φ = c_A χ_A + c_B χ_B</div>
<h3>H₂ の場合</h3>
<div class="duo">
<div><strong>φ₊（足し算）</strong><span>同じ符号で強め合う干渉</span><span>エネルギーが下がる → <b>結合性軌道</b></span></div>
<div><strong>φ₋（引き算）</strong><span>逆の符号で弱め合う干渉、節ができる</span><span>エネルギーが上がる → <b>反結合性軌道</b>（* をつける）</span></div>
</div>
<p>H₂ の MO に電子2個を入れて展開すると、共有結合の項とイオン（H⁺H⁻）の項が同じ重みで出てくる。単純な VB 法は共有結合の項だけ。現実はその中間。</p>
<h3>結合次数</h3>
<div class="formula">結合次数 = (結合性軌道の電子数 − 反結合性軌道の電子数)/2</div>
<p>内殻の電子は結合性・反結合性の両方に入って打ち消し合うので無視してよい。重要なのは HOMO（最高被占軌道）と LUMO（最低空軌道）＝<b>フロンティア軌道</b>。</p>
<h3>O₂ が常磁性になる理由（重要）</h3>
<p>O₂ の電子は π*2p に2個入る。2つの π* 軌道に1個ずつ、<b>スピンをそろえて</b>入るので、<b>不対電子が2個</b>ある → 常磁性。</p>
<div class="formula">O₂ の結合次数 = (8 − 4)/2 = 2　F₂ = (8 − 6)/2 = 1</div>
<div class="note">ルイス構造（O=O）では電子がすべて対になって磁性がないと予想してしまう。反結合性軌道まで考えるのが MO 法の強み。</div>
<p class="slide">対応スライド：02「MO理論」〜「O₂の常磁性」</p>`},

{t:'二原子分子',html:`
<h2>二原子分子の分子軌道</h2>
<h3>N₂ と O₂ で軌道の順番が入れかわる</h3>
<p>光電子スペクトルから、N₂ では <b>σ2p が π2p より上</b>にあることが分かる。原因は <b>sp-mixing</b>：対称性が同じ σ2s と σ2p が混ざり合い、σ2p が押し上げられる。</p>
<div class="duo">
<div><strong>Li₂ 〜 N₂</strong><span>π2p < σ2p</span><span>2s と 2p のエネルギー差が小さく、sp-mixing が強い</span></div>
<div><strong>O₂、F₂</strong><span>σ2p < π2p</span><span>核電荷が大きく 2s が深く下がり、2s−2p の差が大きい → sp-mixing が弱い</span></div>
</div>
<p>相互作用は、<b>対称性が同じ・空間的に重なる・エネルギーが近い</b>ほど強い。</p>
<h3>異核二原子分子</h3>
<ul>
<li>電気陰性度の大きい原子の軌道ほど<b>低いエネルギー</b>にある</li>
<li>結合性 MO は電気陰性度の大きい原子側に偏り、反結合性 MO は小さい原子側に偏る</li>
<li>2つの原子軌道のエネルギー差が大きいほど相互作用は弱く、<b>イオン性</b>が強くなる</li>
</ul>
<h3>HF</h3>
<p>F の 2s はとても深く、ほぼ結合に関わらない。F の 2px・2py は相手になる H の軌道がないので<b>非結合性</b>。F 2pz と H 1s で σ と σ* を作る。電子は主に F 側 → F が負に分極。</p>
<h3>CO</h3>
<p>O の軌道は C より低い。HOMO（3σ）は<b>C 側</b>に大きく広がっているので、CO は<b>炭素で金属に配位</b>する。浅い HOMO と深い LUMO（π*）を持ち、電子を出しやすく受け取りやすい → ヘモグロビンの鉄に強く結合して有毒。</p>
<div class="note">CO は電気陰性度から予想するのとは逆に、C⁻−O⁺（Cδ−、Oδ+）の向きに分極している。</div>
<p class="slide">対応スライド：02「sp-mixing」〜「CO」</p>`},

{t:'多原子分子と結合',html:`
<h2>多原子分子・結合の強さ・酸化数</h2>
<h3>多原子分子の MO</h3>
<p>係数は一般にきれいに解けないので、<b>SCF（自己無撞着場）法</b>でコンピュータ計算する（電子分布を仮定 → MO を計算 → 一致するまで繰り返す）。</p>
<p>対称性の高い分子は <b>SALC（対称適合線形結合）</b>で考える。NH₃ = N ＋ 正三角形に並んだ H₃。H₃ の SALC と同じ対称性の N の軌道を組み合わせる。NH₃ の HOMO（2a₁）はほとんど非結合性で N 上にある → <b>非共有電子対</b>。</p>
<h3>電子不足化合物</h3>
<p>ジボラン B₂H₆ は結合が8本あるのに価電子は12個（16個必要）→ ルイス構造で書けない。B−H−B の<b>三中心二電子結合</b>で説明する。トリメチルアルミニウム Al₂(CH₃)₆ も同じ。</p>
<h3>結合の強さ</h3>
<p>平均結合エンタルピー（kJ/mol）：H−H 436、C−H 412、C−C 348、C=C 612、C≡C 837、N≡N 946、O=O 497、F−F 158、H−F 565。反応エンタルピーの符号や大きさをざっくり見積もれる。</p>
<h3>ケテラーの三角形</h3>
<ul>
<li>電気陰性度の差 Δχ が大きい → <b>イオン結合</b>（CsF）</li>
<li>Δχ が小さく、χ が小さい → <b>金属結合</b>（Cs）</li>
<li>Δχ が小さく、χ が大きい → <b>共有結合</b>（F₂）</li>
</ul>
<p>例：MgO（Δχ = 2.13）はイオン結合、SiO₂（Δχ = 1.54、平均 χ 2.67）は共有結合の領域。</p>
<h3>酸化数の決め方（上のルールほど優先）</h3>
<ol>
<li>全原子の酸化数の和 = 化学種の電荷。単体は 0</li>
<li>1族 +1、2族 +2、13族（B を除く）+3、14族（C・Si を除く）+4</li>
<li>H は非金属と +1、金属と −1</li>
<li>F は常に −1</li>
<li>O は −2（F と結合するときを除く）。過酸化物 O₂²⁻ は −1、超酸化物 O₂⁻ は −1/2</li>
<li>ハロゲンは −1（O や、自分より電気陰性度の大きいハロゲンと結合するときを除く）</li>
</ol>
<p>例：[MnO₄]⁻ の Mn は +7、[MnO₄]²⁻ は +6、PO₄³⁻ の P は +5、O₂⁺ の O は +1/2、[Cr(H₂O)₆]Cl₃ の Cr は +3。</p>
<p class="slide">対応スライド：02「多原子分子」〜「酸化数」</p>`}
],

{t:'格子と単位胞',html:`
<h2>結晶の構造をどう書き表すか</h2>
<p class="lead">結晶は<b>単位胞</b>のくり返しでできている（並進対称性）。例外は準結晶（2011年ノーベル化学賞）。</p>
<div class="formula">結晶構造 = 格子 × 原子基底</div>
<ul>
<li><b>格子点</b>：並進させると全部重なる点。どの格子点から見てもまわりの様子が同じ（回転はダメ）。格子点に原子があってもなくてもよい</li>
<li><b>基底</b>：各格子点に置く原子の組</li>
<li>格子は「枠」だけなので、結晶構造を表すには基底も必要</li>
</ul>
<div class="duo">
<div><strong>基本単位胞</strong><span>格子点が1つだけ</span><span>情報が最小。計算向き</span></div>
<div><strong>慣用単位胞</strong><span>対称性が高く見えるように選ぶ（格子点が2つ以上のことも）</span><span>X 線回折・結晶学の基本</span></div>
</div>
<h3>7つの結晶系と14のブラベー格子</h3>
<p>辺の長さ a・b・c と角度 α・β・γ で <b>7つの結晶系</b>に分け、格子点の置き方（単純 P・体心 I・面心 F・底心 C）を組み合わせると <b>14種類のブラベー格子</b>になる。</p>
<div class="tblwrap"><table class="tbl">
<tr><th>結晶系</th><th>条件</th><th>ブラベー格子</th></tr>
<tr><td>立方</td><td>a = b = c、すべて 90°</td><td>P・I・F</td></tr>
<tr><td>正方</td><td>a = b ≠ c、すべて 90°</td><td>P・I</td></tr>
<tr><td>斜方（直方）</td><td>a ≠ b ≠ c、すべて 90°</td><td>P・C・I・F</td></tr>
<tr><td>六方</td><td>a = b ≠ c、γ = 120°</td><td>P</td></tr>
<tr><td>三方</td><td>a = b = c、α = β = γ ≠ 90°</td><td>R</td></tr>
<tr><td>単斜</td><td>α = γ = 90°、β ≠ 90°</td><td>P・C</td></tr>
<tr><td>三斜</td><td>どれも等しくない</td><td>P</td></tr>
</table></div>
<div class="note">「面心正方格子」がないのはなぜ？ 底面の軸を45°回して取り直すと、a′ = b′ = a/√2 の<b>体心正方格子</b>になり、同じものだから。</div>
<p class="slide">対応スライド：03「3.1 結晶構造の記述」〜「ブラベー格子」</p>`},

{t:'金属と合金',html:`
<h2>金属の結晶構造</h2>
<p class="lead">金属は方向性のある共有結合を作りにくく、球をぎっしり詰めた<b>最密充填</b>をとるものが多い。</p>
<div class="tblwrap"><table class="tbl">
<tr><th>構造</th><th>充填率</th><th>配位数</th><th>格子との関係</th></tr>
<tr><td>体心立方 bcc</td><td>68%</td><td>8</td><td>体心立方格子 × 原子1個</td></tr>
<tr><td>立方最密 ccp</td><td>74%</td><td>12</td><td>面心立方格子（fcc）× 原子1個</td></tr>
<tr><td>六方最密 hcp</td><td>74%</td><td>12</td><td>六方格子 × 原子2個</td></tr>
</table></div>
<p>最密充填の層の重ね方：<b>ABAB… が hcp</b>、<b>ABCABC… が ccp</b>。</p>
<ul>
<li>s 電子で結合する金属（アルカリ金属）は bcc をとりやすい</li>
<li>温度で構造が変わる（多形）。低温で最密充填でも、高温では bcc になることが多い（振動エントロピーで有利）</li>
</ul>
<h3>構造と性質</h3>
<p>金属は結晶面に沿ってずれる（<b>すべり</b>）ことで変形する。</p>
<div class="duo">
<div><strong>hcp</strong><span>すべれる方向が限られる</span><span><b>もろい</b>（Co、Mg）</span></div>
<div><strong>ccp</strong><span>すべれる方向がたくさんある</span><span><b>展性が大きい</b>（Au、Cu）</span></div>
</div>
<h3>原子半径と配位数</h3>
<p>配位数が多いほど、まわりの原子と反発して原子間距離が長くなる。ゴールドシュミット補正（配位数12を1とする）：8 → 0.97、6 → 0.96、4 → 0.88。</p>
<h3>合金</h3>
<div class="defs">
<div><span class="k">置換型</span><span>原子が入れかわる（真鍮・青銅・ステンレス）。条件：原子半径の差が約15%以内、同じ結晶構造、電気陰性度が近い（大きくちがうと化合物になる）</span></div>
<div><span class="k">侵入型</span><span>すき間に小さな原子が入る（炭素鋼、B・N）。すべりが止まって<b>硬くなり展性が下がる</b></span></div>
<div><span class="k">金属間化合物</span><span>決まった組成の化合物になる</span></div>
</div>
<h3>最密充填のすき間</h3>
<p>原子 N 個に対して、<b>八面体間隙が N 個</b>（入れる球の半径比の上限 0.414）、<b>四面体間隙が 2N 個</b>（0.225）。</p>
<p class="slide">対応スライド：03「3.4 金属の結晶構造」〜「最密充填構造の間隙」</p>`},

{t:'イオン固体の構造',html:`
<h2>イオン結晶の代表的な構造</h2>
<p class="lead">イオンを、方向性のない静電力で引き合う<b>かたい球</b>とみなす（イオンモデル）。片方のイオンが最密充填をつくり、そのすき間に相手のイオンが入る、と考えると整理しやすい。</p>
<p>イオン固体の性質：もろく特定の面で割れる（へき開：ずれると同じ電荷が向き合って反発）、融点が高い、水に溶けやすい（ただし BaSO₄ のような多価イオンの塩は溶けにくいものも多い）。</p>
<div class="tblwrap"><table class="tbl">
<tr><th>構造</th><th>つくり</th><th>配位数</th><th>例</th></tr>
<tr><td>岩塩型</td><td>陰イオン ccp の八面体間隙すべてに陽イオン</td><td>6:6</td><td>NaCl、MgO、AgCl</td></tr>
<tr><td>塩化セシウム型</td><td>陰イオン単純立方の立方体間隙すべてに陽イオン</td><td>8:8</td><td>CsCl</td></tr>
<tr><td>閃亜鉛鉱型</td><td>陰イオン ccp の四面体間隙の半分</td><td>4:4</td><td>ZnS、GaP</td></tr>
<tr><td>ウルツ鉱型</td><td>陰イオン hcp の四面体間隙の半分</td><td>4:4</td><td>ZnS、ZnO、AlN</td></tr>
<tr><td>蛍石型</td><td>陽イオン ccp の四面体間隙すべてに陰イオン</td><td>8:4</td><td>CaF₂、UO₂</td></tr>
<tr><td>ルチル型</td><td>陰イオン hcp の八面体間隙の半分</td><td>6:3</td><td>TiO₂、SnO₂</td></tr>
<tr><td>ペロブスカイト型</td><td>ABX₃。A は12配位、B は6配位（BX₆ 八面体）</td><td></td><td>CaTiO₃、SrTiO₃</td></tr>
</table></div>
<p>逆蛍石型（K₂O、Li₂O）は蛍石型の陽イオンと陰イオンを入れかえたもの。</p>
<h3>半径比則</h3>
<p>γ = r（小さいほう）/ r（大きいほう）で、とりうる配位数の目安が決まる。</p>
<div class="tblwrap"><table class="tbl">
<tr><th>γ</th><th>配位数</th><th>構造</th></tr>
<tr><td>0.732 〜 1</td><td>8</td><td>CsCl 型、CaF₂ 型</td></tr>
<tr><td>0.414 〜 0.732</td><td>6</td><td>NaCl 型、ルチル型</td></tr>
<tr><td>0.225 〜 0.414</td><td>4</td><td>ZnS 型</td></tr>
</table></div>
<p>NaCl 型の限界 √2 − 1 ≈ 0.414、CsCl 型の限界 √3 − 1 ≈ 0.732。可能ならより高い配位数をとる（静電的に安定）。</p>
<h3>イオン半径と構造マップ</h3>
<ul>
<li>イオン半径の傾向は原子半径とほぼ同じ。電荷が正になるほど小さく、陽イオン < 陰イオン。配位数が多いほど大きい</li>
<li>構造マップ：Δχ が大きい（右）ほどイオン性で高配位、平均主量子数が大きい（上）ほど方向性が弱く高配位</li>
<li>MX₂ のイオン性：CaF₂ 型（8:4）> ルチル型（6:3）> シリカ型（4:2）</li>
</ul>
<p class="slide">対応スライド：03「3.6 イオン固体」〜「構造マップ」</p>`},

{t:'格子エンタルピー',html:`
<h2>なぜイオン結晶は安定なのか</h2>
<p class="lead">Na（I = 5.1 eV）から Cl（Eₐ = 3.6 eV）へ電子を渡すだけなら <b>1.5 eV の吸熱</b>。それでも NaCl ができるのは、イオンが集まって安定化する<b>格子エンタルピー</b>があるから。</p>
<div class="formula">ΔLH：MX(s) → M⁺(g) + X⁻(g) の標準エンタルピー変化（正の値）<small>NaCl 786、KCl 719、MgO 3795、CaF₂ 2597 kJ/mol</small></div>
<h3>ボルン・ハーバーサイクル</h3>
<p>直接測れない ΔLH を、測れる値の組み合わせで求める（ヘスの法則）。</p>
<div class="formula">KCl：ΔLH = 438 + 89 + 425 + 122 − 355 = 719 kJ/mol<small>生成エンタルピー 438（−ΔfH）、K の昇華 89、K のイオン化 425、Cl₂ 解離の半分 122、Cl の電子取得 −355</small></div>
<h3>ボルン・マイヤー式</h3>
<div class="formula">ΔLH = (N_A |z_A z_B| e² / 4πε₀r₀)(1 − ρ/r₀) M</div>
<div class="defs">
<div><span class="k">r₀</span><span>最近接のイオン中心間距離</span></div>
<div><span class="k">ρ</span><span>反発の及ぶ範囲を表す定数</span></div>
<div><span class="k">M</span><span><b>マーデルング定数</b>：1つのイオンがほかの全イオンから受けるクーロン相互作用を、最近接距離で規格化した数。構造で決まる</span></div>
</div>
<p>1次元に ±交互に並ぶと M = 2(1 − 1/2 + 1/3 − …) = 2 ln2 ≈ 1.386。3次元では NaCl 1.748、CsCl 1.763、蛍石 2.519、ルチル 2.408、閃亜鉛鉱 1.638。</p>
<p>同じ構造なら、ΔLH は<b>静電パラメータ ζ = |z_A z_B|/r₀</b> が大きいほど大きい。</p>
<h3>理論値と実験値のずれ</h3>
<p>LiF ではほぼ一致（差 1）、AgI では大きくずれる（差 105）。<b>共有結合性が大きいほどずれる</b>。Δχ > 2 ならイオンモデルがよく合う。分極しやすい I⁻ や Ag⁺ でずれが大きい（HSAB 則とも関係）。</p>
<h3>格子エンタルピーで説明できること</h3>
<ul>
<li><b>カプスティンスキー式</b>：構造を知らなくても ΔLH を見積もれる。ΔLH = (N_ion|z_A z_B|/d)(1 − d*/d)K（K = 1.21×10⁵ kJ pm/mol、d* = 34.5 pm）。KNO₃ なら 662 kJ/mol</li>
<li><b>酸化状態の安定性</b>：F⁻ や O²⁻ のような小さい陰イオンは高い酸化数の陽イオンを安定化する。CuF は不安定（CuF₂ と Cu に不均化）、CuI₂ は不安定（I⁻ が Cu²⁺ を還元）</li>
<li><b>熱分解の起こりやすさ</b>：MCO₃ → MO + CO₂。陽イオンが小さいほど、大きい CO₃²⁻ から小さい O²⁻ に変わるときの安定化が大きく、分解しやすい。MgCO₃ 約300 °C、CaCO₃ 約800 °C。アルカリ土類の炭酸塩はアルカリ金属より低温で分解</li>
</ul>
<p class="slide">対応スライド：03「3.9 格子エンタルピー」〜「熱安定性」</p>`},

{t:'欠陥と不定比性',html:`
<h2>結晶は完璧ではない</h2>
<p class="lead">実際の固体には必ず<b>欠陥</b>がある。G = H − TS のエントロピー項が欠陥を作る原動力で、高温ほど欠陥が増える。ごくわずかな欠陥でも性質が大きく変わる（Si 半導体は1億個に1個くらいの欠陥で導電性を制御）。</p>
<h3>固有点欠陥（化学量論比は変わらない）</h3>
<div class="defs">
<div><span class="k">ショットキー</span><span>陽イオンと陰イオンが<b>セットで抜ける</b>。配位数の高いイオン性物質で起こりやすい（NaCl）</span></div>
<div><span class="k">フレンケル</span><span>イオンが<b>格子のすき間に移動</b>する。小さいイオンが入れる系で起こりやすい（AgCl の Ag⁺）</span></div>
<div><span class="k">原子交換</span><span>合金で原子が入れかわる（Cu−Au）</span></div>
</div>
<h3>外因性点欠陥（不純物欠陥）</h3>
<p>微量の外部元素（<b>ドーパント</b>）による欠陥。わざと入れて電気・光の性質を制御できる。</p>
<ul>
<li>ルビー = Al₂O₃ ＋ Cr（約0.2%）、サファイア = Al₂O₃ ＋ Ti・Fe</li>
<li>ZnO に Al をドープ → Zn（12族）より価電子が1個多い → 余った電子が流れる <b>n 型半導体</b></li>
</ul>
<h3>不定比化合物</h3>
<p>構造は同じなのに組成が一定でない物質。例：<b>Fe₁₋ₓO</b>（x = 0.04〜0.11）は、高温でまわりの酸素分圧に合わせて「呼吸するように」組成が変わる。異なる酸化数の金属が混ざった状態とみなせ、電気的性質に大きく影響する。遷移金属化合物の多くは多かれ少なかれ不定比。</p>
<p class="slide">対応スライド：03「3.16 欠陥」〜「3.17 不定比化合物」</p>`},

{t:'バンド構造',html:`
<h2>固体の電子構造：バンド</h2>
<h3>電気伝導による分類</h3>
<div class="defs">
<div><span class="k">金属</span><span>温度が上がると伝導率が<b>下がる</b></span></div>
<div><span class="k">半導体</span><span>温度が上がると伝導率が<b>上がる</b>（Si、Ge）</span></div>
<div><span class="k">絶縁体</span><span>伝導率がとても低い（理屈では半導体の一種）</span></div>
</div>
<p>電気抵抗率は物質によって24桁もちがう。</p>
<h3>バンドとバンドギャップ</h3>
<p>N 個の原子軌道から N 個の分子軌道ができる。原子がとても多い固体では準位の間隔がとても小さく、連続した<b>バンド</b>として扱う。バンドの幅は主に軌道どうしの相互作用で決まる。バンドの間に軌道がないエネルギー領域が<b>バンドギャップ</b>。</p>
<p><b>状態密度</b>（エネルギー幅あたりの準位の数）は、ふつうバンドの中央で高く、上下の端で低い。</p>
<h3>フェルミ準位</h3>
<div class="formula">f(E) = 1 / {exp[(E − E_F)/k_BT] + 1}<small>フェルミ・ディラック分布。E_F：電子の占有確率がちょうど 1/2 になる準位</small></div>
<ul>
<li><b>金属</b>：フェルミ準位がバンドの途中にある → 電子はすぐ上の空の準位に移れて、自由に動く。温度が上がると原子の振動（フォノン）で電子が散乱され、伝導率が下がる</li>
<li><b>絶縁体</b>：満たされたバンドと空のバンドの間に大きなギャップ</li>
<li><b>真性半導体</b>：ギャップが狭く、熱で価電子帯から伝導帯へ電子が上がる → 伝導帯に電子、価電子帯に<b>正孔</b>（電荷キャリア）。温度が上がるとキャリアが増える：σ = σ₀ exp(−E_g/2kT)</li>
</ul>
<h3>14族：結合が強いほどギャップが大きい</h3>
<div class="tblwrap"><table class="tbl">
<tr><th>元素</th><th>性質</th><th>ギャップ</th><th>共有結合半径</th></tr>
<tr><td>C（ダイヤモンド）</td><td>透明な絶縁体</td><td>5.5 eV</td><td>77 pm</td></tr>
<tr><td>Si</td><td>半導体</td><td>1.1 eV</td><td>118 pm</td></tr>
<tr><td>Ge</td><td>半導体</td><td>0.7 eV</td><td>122 pm</td></tr>
<tr><td>Sn（β）</td><td>金属</td><td>―</td><td>140 pm</td></tr>
</table></div>
<p>原子が近く重なりが大きいほど、結合性軌道（価電子帯）は下がり反結合性軌道（伝導帯）は上がる → ギャップが大きくなる。化合物半導体（GaN、GaAs、ZnSe など）では結合の強さを変えて、<b>発光の波長（∝ 1/ギャップ）を設計</b>できる。</p>
<h3>不純物半導体</h3>
<div class="duo">
<div><strong>n 型</strong><span>Si（14族）に As（15族）</span><span>余った電子が浅い<b>ドナー準位</b>から伝導帯へ</span></div>
<div><strong>p 型</strong><span>Si（14族）に Ga（13族）</span><span>価電子帯のすぐ上に<b>アクセプター準位</b>ができ、価電子帯に正孔が残る</span></div>
</div>
<h3>NaCl はなぜ透明な絶縁体なのか</h3>
<p>価電子帯は Cl⁻ の 3p、伝導帯は Na⁺ の空の 3s。ギャップは約 9 eV と大きいので、室温で電子は熱で上がれない（絶縁体）し、可視光の光子のエネルギーでも上がれない（透明）。</p>
<p>ギャップが大きい理由：結晶中では周囲のイオンがつくる静電場（マーデルングポテンシャル V_M ≈ 9 V）で、Cl⁻ の電子は安定化し Na⁺ の準位は押し上げられる。ΔE ≈ Eₐ − I + 2eV_M ≈ 17 eV。実際は分極とバンドの幅の補正で約 9 eV になる。</p>
<p class="slide">対応スライド：03「3.18 電気伝導率」〜「イオン固体モデルとバンドによる物性説明」</p>`}

// ===== 10/20 第4章 酸と塩基 =====
L({subj:'muki',id:'m1020',date:'10/20',title:'第4章 酸と塩基',short:'4章 酸と塩基',
ch:[
{t:'3つの定義とKa',html:`
<h2>酸と塩基の3つの定義</h2>
<div class="tblwrap"><table class="tbl">
<tr><th>定義</th><th>酸</th><th>塩基</th><th>分かること</th></tr>
<tr><td>Arrhenius（1884）</td><td>H⁺ を生む</td><td>OH⁻ を生む</td><td>水溶液の反応だけ</td></tr>
<tr><td>Brønsted–Lowry（1923）</td><td>プロトン供与体</td><td>プロトン受容体</td><td>酸・塩基の<b>強弱</b></td></tr>
<tr><td>Lewis（1923）</td><td>電子対受容体</td><td>電子対供与体</td><td>反応の<b>選択性</b>（HSAB 則、1960年代 Pearson）</td></tr>
</table></div>
<p>下の定義ほど<b>一般性が高い</b>。アレニウスの定義では、気体の HCl と気体の NH₃ から固体の NH₄Cl ができる反応を酸塩基反応とみなせない。</p>
<h3>共役酸と共役塩基</h3>
<div class="formula">HF（酸1）+ H₂O（塩基2）⇔ H₃O⁺（酸2）+ F⁻（塩基1）<small>F⁻ は HF の共役塩基、H₃O⁺ は H₂O の共役酸</small></div>
<p>水は酸としても塩基としてもはたらく<b>両性物質</b>（両性溶媒）。</p>
<h3>酸性度定数 Ka</h3>
<div class="formula">Ka = [H₃O⁺][A⁻]/[HA]　pKa = −log Ka<small>うすい水溶液では水の活量 ≈ 1 とし、溶質の活量を濃度で近似する</small></div>
<p><b>強酸は pKa < 0（Ka > 1）</b>、弱酸は pKa > 0。H₃O⁺ の pKa = 0 が基準。</p>
<div class="tblwrap"><table class="tbl">
<tr><th>酸</th><th>pKa</th><th>酸</th><th>pKa</th></tr>
<tr><td>HI</td><td>−11</td><td>HF</td><td>3.45</td></tr>
<tr><td>HClO₄</td><td>−10</td><td>CH₃COOH</td><td>4.76</td></tr>
<tr><td>HBr</td><td>−9</td><td>H₂CO₃</td><td>6.37</td></tr>
<tr><td>HCl</td><td>−7</td><td>NH₄⁺</td><td>9.25</td></tr>
<tr><td>H₂SO₄・HNO₃</td><td>−2</td><td>HCN</td><td>9.31</td></tr>
<tr><td>H₃O⁺</td><td>0</td><td>HS⁻</td><td>19</td></tr>
</table></div>
<p>塩基性度定数 Kb = [BH⁺][OH⁻]/[B]（NH₃ は 1.8×10⁻⁵）。</p>
<p class="slide">対応スライド：04「酸と塩基の定義」〜「代表的なブレンステッド酸の強さ」</p>`},

{t:'溶媒と水平化',html:`
<h2>溶媒の自己プロトリシスと水平化効果</h2>
<p class="lead">両性溶媒（水・メタノール・アンモニアなど）は、分子どうしで H⁺ をやりとりして少しだけ解離している。</p>
<div class="formula">2 Sol ⇌ SolH⁺ + Sol⁻　K_HSol ≈ [SolH⁺][Sol⁻]</div>
<div class="formula">水：2H₂O ⇔ H₃O⁺ + OH⁻　Kw = 1.00 × 10⁻¹⁴（25 °C）</div>
<h3>中性の pH は 7 とは限らない</h3>
<p>中性は [H⁺] = [OH⁻] のこと。25 °C では [H⁺] = √Kw = 10⁻⁷ → pH 7。でも Kw は温度で変わるので、<b>50 °C の中性は pH ≈ 6.51、0 °C の中性は pH ≈ 7.47</b>。</p>
<h3>共役酸塩基対の関係</h3>
<div class="formula">Ka(HA) × Kb(A⁻) = K_sol　→　pKa(HA) + pKb(A⁻) = pK_sol</div>
<h3>水平化効果</h3>
<ul>
<li>pKa ≪ 0 の酸は、溶媒にほとんど H⁺ を渡してしまい、溶液は H₂Sol⁺ の溶液のようにふるまう → <b>強さを区別できない</b></li>
<li>pKb < 0 の塩基は、溶媒からほとんど H⁺ を受け取り、溶液は Sol⁻ の溶液のようにふるまう</li>
<li>だから<b>溶媒中で区別できる酸の強さは 0 < pKa < pK_HSol の範囲</b>。範囲の幅は pK_sol に比例</li>
</ul>
<div class="note">水の中では HCl も HBr も HI も「H₃O⁺ の溶液」になり、強さの差が見えない。もっと酸性の弱い溶媒（酢酸など）を使えば区別できる。</div>
<p class="slide">対応スライド：04「両性溶媒の自己プロトリシス」〜「溶媒の水平化効果」</p>`},

{t:'ブレンステッド酸の傾向',html:`
<h2>どんな酸が強いのか</h2>
<h3>(a) 多塩基酸：解離が進むほど弱くなる</h3>
<p>H₃PO₄：pKa₁ 2.15 → pKa₂ 7.20 → pKa₃ 12.35。H⁺ が抜けるたびに共役塩基の負電荷が増え、次の H⁺ が抜けにくくなる。pH < pKa₁ では H₃PO₄、pH > pKa₃ では PO₄³⁻ が主。</p>
<h3>(b) オキソ酸：O が多いほど強い</h3>
<p>オキソ酸 = 中心原子に −OH が結合し、その H⁺ を出せる化合物（H₂CO₃、HNO₃、H₃PO₄、H₂SO₄）。</p>
<div class="formula">ポーリングの規則：OₚE(OH)_q の pKa ≈ 8 − 5p<small>多塩基酸の逐次解離では、H⁺ が1つ抜けるごとに pKa が約5ずつ大きくなる</small></div>
<div class="formula">HClO₄（−10）< HClO₃（−1.0）< HClO₂（2.0）< HClO（7.2）の順に弱い</div>
<p>理由は2つ。</p>
<ol>
<li><b>誘起効果</b>：電気陰性度の大きい O が電子を引き、中心原子がより正になる → 共役塩基が安定。OH をもっと電子求引性の基にかえると強くなる（フルオロ硫酸 > 硫酸）</li>
<li><b>共鳴安定化</b>：=O が多いほど、共役塩基の負電荷が多くの O に広がる</li>
</ol>
<p>同じ理由でカルボン酸（pKa 4.8）はアルコール（pKa 16）よりずっと強い。</p>
<h3>(c) アクア酸</h3>
<p>金属イオンに配位した水が H⁺ を出す（[Fe(OH₂)₆]³⁺ など）。ほかに、OH⁻ が配位したヒドロキソ酸（Si(OH)₄）、−OH と =O が同じ原子にあるオキソ酸がある。</p>
<p>アクア酸は<b>中心イオンの電荷が大きく、半径が小さいほど強い</b>。静電パラメータ ξ = 100z²/r とよく相関するが、高い電荷の d・p ブロック金属イオンは予想より強い酸になる（金属イオンへ電子が流れ込む共有結合性のため）。</p>
<h3>(d) ハロゲン化水素：下ほど強い</h3>
<p>HF 3.45、HCl −7、HBr −9、HI −11。要因のひとつは<b>結合エネルギー</b>：下ほど結合が長く、軌道の重なりが小さく、結合が弱い（HF 562 → HI 299 kJ/mol）。ただし実際は水和エンタルピーやエントロピーも効いていて、説明は意外と複雑。</p>
<p class="slide">対応スライド：04「ブレンステッド酸の傾向（a）〜（d）」</p>`},

{t:'酸化物と等電点',html:`
<h2>酸化物の酸性・塩基性</h2>
<div class="defs">
<div><span class="k">酸性</span><span>水と結合して H⁺ を出す。CO₂ + H₂O ⇌ OC(OH)₂ → H⁺。例：CO₂、NO₂、SO₂、SO₃、V₂O₅、CrO₃、WO₃、Mn₂O₇</span></div>
<div><span class="k">塩基性</span><span>水から H⁺ を受け取る。BaO + H₂O → Ba²⁺ + 2OH⁻。例：Li₂O、Na₂O、MgO、K₂O、CaO、BaO</span></div>
<div><span class="k">両性</span><span>酸とも塩基とも反応する（金属と非金属の境目）。例：Al₂O₃、Ga₂O₃、SnO₂、GeO₂、BeO</span></div>
</div>
<div class="formula">Al₂O₃ + 6H₃O⁺ + 3H₂O → 2[Al(OH₂)₆]³⁺<br>Al₂O₃ + 2OH⁻ + 3H₂O → 2[Al(OH)₄]⁻</div>
<h3>同じ金属でも酸化数で変わる</h3>
<p>Mn は +2 で塩基性、+4 で両性、+7（Mn₂O₇）で酸性。<b>酸化数の大きい金属の酸化物ほど酸性</b>。</p>
<ul>
<li>中心金属の LUMO が下がる → M−O の共有結合が強くなる</li>
<li>中心金属の価数が上がる → M−O の静電相互作用が強くなる</li>
<li>→ どちらも H⁺ を離しやすくする（アクア酸の傾向と同じ）</li>
</ul>
<h3>等電点（IEP）</h3>
<p>水に溶けない粒子・コロイド・タンパク質の酸塩基性は、表面の電位（<b>ζ 電位</b>）で評価する。表面の −OH は、酸性では H⁺ を受け取って正に（−OH₂⁺）、塩基性では H⁺ を失って負に（−O⁻）なる。</p>
<div class="formula">ζ 電位がゼロになる溶液の pH = 等電点（IEP）<small>例：牛血清アルブミン（BSA）は約 pH 5。酸性の溶液ほど ζ 電位は高い</small></div>
<p class="slide">対応スライド：04「無水酸化物の酸と塩基」〜「等電点」</p>`},

{t:'ルイス酸',html:`
<h2>ルイス酸・ルイス塩基</h2>
<div class="formula">ルイス酸 = 電子対受容体　ルイス塩基 = 電子対供与体</div>
<div class="formula">Me₃B（ルイス酸）+ :NH₃（ルイス塩基）→ Me₃B−NH₃</div>
<h3>ブレンステッドとの関係</h3>
<ul>
<li>プロトン H⁺ はルイス酸（NH₃ の電子対にくっついて NH₄⁺ になる）</li>
<li>すべてのブレンステッド酸 HA は、ルイス酸 H⁺ とルイス塩基 A⁻ の錯体とみなせる</li>
<li>すべてのブレンステッド塩基はルイス塩基</li>
<li>→ ルイスの定義のほうが一般的。ただし用語としては区別して使うことが多い</li>
</ul>
<h3>ルイス酸塩基反応の4パターン</h3>
<ol>
<li>オクテットが不完全な分子が電子対を受け取る（BMe₃ + NH₃）</li>
<li>金属陽イオンが配位子の電子対と結合して錯体になる（[Co(OH₂)₆]²⁺）</li>
<li>価電子の配置を組みかえて受け取る（CO₂ + OH⁻ → HCO₃⁻）</li>
<li>原子価殻を広げてもう1つ受け取る（SiF₄ + 2F⁻ → SiF₆²⁻）</li>
</ol>
<h3>族ごとの例</h3>
<div class="defs">
<div><span class="k">s ブロック</span><span>アルカリ・アルカリ土類の陽イオンはすべてルイス酸。水和は H₂O（ルイス塩基）との会合</span></div>
<div><span class="k">13族</span><span>BX₃ は強いルイス酸。強さは <b>BF₃ < BCl₃ < BBr₃</b>（直観と逆）。F の非共有電子対が B の空の 2p に流れ込んで π 結合をつくり、ルイス酸性を弱める。B 2p と大きさ・エネルギーが近い F で最も効く</span></div>
<div><span class="k">14族</span><span>C 以外は超原子価（5配位・6配位）をとってルイス酸になる（SiF₆²⁻）。SnCl₂ はルイス酸にもルイス塩基にもなる</span></div>
<div><span class="k">15族</span><span>重い元素の酸化物・ハロゲン化物はルイス酸（SbF₅ + 2HF → SbF₆⁻ + H₂F⁺）</span></div>
<div><span class="k">16族</span><span>SO₂ はルイス酸にもルイス塩基にもなる</span></div>
<div><span class="k">17族</span><span>X⁻ は典型的なルイス塩基。Br₂・I₂ は低い σ* 軌道で電子を受け取るおだやかなルイス酸（I₂ + I⁻ → I₃⁻、K = 725）</span></div>
</div>
<p class="slide">対応スライド：04「ルイス酸・ルイス塩基」〜「典型的なルイス酸・ルイス塩基（各論）」</p>`},

{t:'HSAB則',html:`
<h2>HSAB 則：硬い同士、軟らかい同士</h2>
<p class="lead">ブレンステッド酸塩基の強さは「H⁺ とのくっつきやすさ」の1本の軸で比べられる。でもルイス酸塩基では相手によってくっつきやすさが変わる（<b>相性</b>がある）ので、1本の軸では表せない。この相性の傾向をまとめたのが Pearson の <b>HSAB 則</b>（1963年）。</p>
<div class="formula">硬い酸は硬い塩基と、軟らかい酸は軟らかい塩基と好んで結合する</div>
<div class="duo">
<div><strong>硬い</strong><span>酸：小さい・価数が大きい・分極率が小さい・LUMO が浅い（Li⁺、Mg²⁺、Al³⁺）</span><span>塩基：小さい・分極率が小さい・HOMO が深い（O²⁻、F⁻、H₂O、NH₃、OH⁻）</span></div>
<div><strong>軟らかい</strong><span>酸：大きい・価数が小さい・分極率が大きい・LUMO が深い（Ag⁺、Pd²⁺、Cd²⁺、Hg²⁺、Cu⁺）</span><span>塩基：大きい・分極率が大きい・HOMO が浅い（I⁻、HS⁻、H₂S、CN⁻、CO）</span></div>
</div>
<p>中間：Fe²⁺、Co²⁺、Ni²⁺、Cu²⁺、Zn²⁺、Pb²⁺ / Br⁻、NO₂⁻、ピリジン など。</p>
<p>例：銀のアクセサリーは酸化ではなく<b>硫化</b>して黒くなる（軟らかい Ag⁺ と軟らかい S）。Hg²⁺ のハロゲン化物の安定度は F⁻ ≪ I⁻、Al³⁺ は逆に F⁻ がいちばん。</p>
<h3>なぜ相性があるのか</h3>
<div class="duo">
<div><strong>硬い＝イオン結合的</strong><span>静電相互作用。半径が小さく価数が大きいほど有利</span></div>
<div><strong>軟らかい＝共有結合的</strong><span>塩基の HOMO と酸の LUMO の軌道相互作用。HOMO が浅く、LUMO が深く、分極しやすいほど、エネルギーが近づいて安定化が大きい</span></div>
</div>
<h3>周期表で見ると（大まかな目安）</h3>
<ul>
<li>陽イオン：周期が下がる（半径が大きい）と軟らかい。遷移金属の後半（有効核電荷が大きく LUMO が深い＝貴金属）は軟らかい。硬軟を決めるうえでは LUMO の深さがより重要</li>
<li>陰イオン：N・O・F は硬い、下の元素ほど軟らかい</li>
</ul>
<h3>応用：金属イオンの系統分析</h3>
<div class="flow">
<div><b>0.3 M HCl</b> → 第1属 AgCl、Hg₂Cl₂、PbCl₂（軟らかい・貴金属。M−Cl の共有結合性が強く難溶）</div>
<div><b>H₂S（酸性）</b> → 第2属 CuS、CdS、HgS（軟らかい。S²⁻ がわずかでも沈殿）</div>
<div><b>OH⁻</b> → 第3属 Al(OH)₃、Cr(OH)₃、Fe(OH)₃（硬い・高い価数。硬い OH⁻ と結合）</div>
<div><b>H₂S（塩基性）</b> → 第4属 ZnS、NiS、CoS（第2属ほど軟らかくない。S²⁻ が多いと沈殿）</div>
<div><b>CO₃²⁻</b> → 第5属 BaCO₃、CaCO₃、SrCO₃（硬い。多価イオンどうしで大きな格子エンタルピー）</div>
</div>
<p class="slide">対応スライド：04「ルイス酸・塩基における相性」〜「HSAB則の適用例」</p>`}
